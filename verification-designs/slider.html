<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick check · Verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --sp-blue: #2D8CFF; --sp-blue-dark: #0B5CFF; --sp-navy: #232333; --sp-gray-1: #F8F9FA; --sp-gray-2: #EDEBE9; --sp-gray-3: #C8C6C4; --sp-gray-4: #605E5C; --sp-white: #FFFFFF; --sp-green: #0B6A0B; --radius-xl: 20px; --shadow-card: 0 10px 30px rgba(0,0,0,.06); }
        body { font-family: 'Segoe UI', -apple-system, sans-serif; background: var(--sp-gray-1); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
        .card { background: var(--sp-white); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); border: 1px solid var(--sp-gray-2); width: 100%; max-width: 420px; padding: 40px 32px; text-align: center; }
        h1 { font-size: 24px; font-weight: 700; color: var(--sp-navy); margin-bottom: 8px; }
        p { font-size: 14px; color: var(--sp-gray-4); margin-bottom: 32px; line-height: 1.5; }
        
        /* Slider Component styles based on your images */
        .slider-container { position: relative; width: 100%; height: 54px; background: #F1F3F5; border-radius: 27px; border: 1px solid var(--sp-gray-2); display: flex; align-items: center; justify-content: center; user-select: none; overflow: hidden; margin-bottom: 16px; }
        .slider-text { font-size: 14px; font-weight: 600; color: #495057; z-index: 1; transition: opacity .2s; }
        .slider-handle { position: absolute; left: 4px; width: 46px; height: 46px; background: var(--sp-white); border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,.12); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 3; transition: background .15s; }
        .slider-handle svg { width: 18px; height: 18px; color: var(--sp-gray-4); stroke-width: 2.5; }
        .slider-progress { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, rgba(45,140,255,.15), rgba(11,106,11,.15)); z-index: 2; pointer-events: none; }
        
        .slider-container.verifying .slider-handle { background: var(--sp-green); left: calc(100% - 50px) !important; cursor: default; }
        .slider-container.verifying .slider-handle svg { color: #fff; }
        
        .hint-text { font-size: 12px; color: var(--sp-gray-4); min-height: 18px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Quick check</h1>
        <p>Confirm you're not a robot to continue.</p>
        
        <div class="slider-container" id="sliderContainer">
            <div class="slider-progress" id="sliderProgress"></div>
            <div class="slider-text" id="sliderText">Slide to continue</div>
            <div class="slider-handle" id="sliderHandle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
        </div>
        <div class="hint-text" id="hintText">Move the slider to continue.</div>
    </div>

    <script>
        const container = document.getElementById('sliderContainer');
        const handle = document.getElementById('sliderHandle');
        const progress = document.getElementById('sliderProgress');
        const text = document.getElementById('sliderText');
        const hint = document.getElementById('hintText');

        let isDragging = false;
        let startX = 0;
        let maxTranslate = 0;
        let isVerified = false;

        function initSlider() {
            maxTranslate = container.clientWidth - handle.clientWidth - 8;
        }

        window.addEventListener('resize', initSlider);
        initSlider();

        handle.addEventListener('mousedown', startDrag);
        handle.addEventListener('touchstart', startDrag, {passive: true});

        function startDrag(e) {
            if (isVerified) return;
            isDragging = true;
            startX = e.clientX || e.touches[0].clientX;
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('touchmove', onDrag, {passive: true});
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchend', stopDrag);
        }

        function onDrag(e) {
            if (!isDragging || isVerified) return;
            const currentX = e.clientX || e.touches[0].clientX;
            const diff = currentX - startX;
            let translate = Math.max(0, Math.min(diff, maxTranslate));
            
            handle.style.transform = `translateX(${translate}px)`;
            progress.style.width = `${translate + handle.clientWidth + 4}px`;

            if (translate > maxTranslate * 0.85) {
                completeVerification();
            }
        }

        function stopDrag() {
            if (!isDragging || isVerified) return;
            isDragging = false;
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('touchmove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('touchend', stopDrag);

            // Snap back if not completed
            if (!isVerified) {
                handle.style.transform = 'translateX(0px)';
                progress.style.width = '0px';
            }
        }

        function completeVerification() {
            if (isVerified) return;
            isVerified = true;
            isDragging = false;

            container.classList.add('verifying');
            handle.style.transform = `translateX(${maxTranslate}px)`;
            progress.style.width = '100%';
            text.innerText = "Verifying...";
            hint.innerText = "Just a moment...";

            setTimeout(() => {
                text.innerText = "Verified";
                hint.innerText = "Redirecting securely...";
                setTimeout(() => {
                }, 1000);
            }, 1500);
        }
    </script>
</body>
</html>
