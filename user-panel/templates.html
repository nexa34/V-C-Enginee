<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templates – VGenius C Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/user.css">
</head>
<body>
    <aside class="main-sidebar" id="mainSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <nav class="main-header navbar"></nav>

    <main class="content-wrapper">
        <div class="page-header">
            <div>
                <h1 class="page-title" style="margin:0;">Choose Template</h1>
                <p style="color:var(--muted);font-size:12px;margin-top:4px;">Select a template to preview and deploy</p>
            </div>
        </div>

        <div style="position:relative;margin-bottom:20px;">
            <i class="fas fa-search" style="position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);"></i>
            <input type="text" class="search-input" id="templateSearch" placeholder="Search templates..." oninput="loadTemplates()" style="width:100%;padding-left:48px;">
            <span style="position:absolute;right:16px;top:50%;transform:translateY(-50%);font-family:var(--font-heading);font-size:10px;color:var(--muted);" id="searchCount">0 templates</span>
        </div>

        <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;" id="filterPills">
            <button class="btn-accent-sm" data-filter="all" onclick="setFilter('all',this)">All</button>
            <button class="btn-outline" data-filter="preload" onclick="setFilter('preload',this)" style="padding:6px 14px;font-size:10px;">Preload</button>
            <button class="btn-outline" data-filter="no_preload" onclick="setFilter('no_preload',this)" style="padding:6px 14px;font-size:10px;">No preload</button>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;" id="templateGrid"></div>
    </main>

    <!-- Preview Modal -->
    <div class="modal-overlay" id="previewModal" style="display:none;" onclick="if(event.target===this)closePreview()">
        <div class="modal-card" style="max-width:1000px;overflow:hidden;">
            <div class="modal-header" style="border-bottom:1px solid var(--border);padding-bottom:12px;display:flex;align-items:center;justify-content:space-between;">
                <span class="modal-title" id="previewTitle">Template</span>
                <div style="display:flex;align-items:center;gap:8px;">
                    <div style="display:flex;gap:4px;background:rgba(255,255,255,0.04);border-radius:6px;padding:2px;">
                        <button class="btn-outline" id="deviceDesktop" onclick="setDevice('desktop',this)" style="padding:4px 10px;font-size:10px;border:none;background:var(--accent);color:#000;"><i class="fas fa-desktop"></i></button>
                        <button class="btn-outline" id="deviceMobile" onclick="setDevice('mobile',this)" style="padding:4px 10px;font-size:10px;border:none;background:transparent;color:var(--text-main);"><i class="fas fa-mobile-alt"></i></button>
                    </div>
                    <button class="modal-close" onclick="closePreview()"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div style="background:#e8eaed;display:flex;align-items:flex-start;justify-content:center;padding:20px;min-height:480px;overflow:auto;" id="previewStage">
                <div style="text-align:center;color:#999;font-family:var(--font-heading);font-size:12px;">Select a template</div>
            </div>
            <div style="display:flex;justify-content:flex-end;gap:8px;padding:12px 0 0;border-top:1px solid var(--border);margin-top:12px;">
                <button class="btn-danger-sm" onclick="closePreview()">Close</button>
                <button class="btn-accent-sm" id="deployFromPreview" onclick="deployFromPreview()"><i class="fas fa-rocket"></i> Deploy This</button>
            </div>
        </div>
    </div>

    <script src="assets/js/user.js"></script>
    <script>
        const token = getToken();
        if (!token) window.location.href = "/user-panel/index";
        let currentFilter = 'all';
        let currentPreviewTemplate = null;
        let currentDevice = 'desktop';
        // Use window-level declaration to avoid scope issues
        window.__previewCache = window.__previewCache || {};
        const previewCache = window.__previewCache;

        initShared('templates');

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('#filterPills button').forEach(b => { b.className = 'btn-outline'; b.style.padding = '6px 14px'; b.style.fontSize = '10px'; });
            btn.className = 'btn-accent-sm';
            loadTemplates();
        }

        function setDevice(device, btn) {
            currentDevice = device;
            const dd = document.getElementById('deviceDesktop');
            const dm = document.getElementById('deviceMobile');
            if (device === 'mobile') {
                dd.style.background = 'transparent'; dd.style.color = 'var(--text-main)';
                dm.style.background = 'var(--accent)'; dm.style.color = '#000';
            } else {
                dd.style.background = 'var(--accent)'; dd.style.color = '#000';
                dm.style.background = 'transparent'; dm.style.color = 'var(--text-main)';
            }
            if (currentPreviewTemplate) renderPreviewIframe();       
        }

 async function loadTemplates() {
            const search = document.getElementById('templateSearch').value;
            const category = currentFilter === 'all' ? '' : currentFilter;
            try {
                const data = await fetchJson(`${API}/templates?search=${encodeURIComponent(search)}&category=${encodeURIComponent(category)}`, { headers: authHeaders() });
                document.getElementById('searchCount').textContent = (data.templates || []).length + ' templates';
                const grid = document.getElementById('templateGrid');
                const templates = data.templates || [];
                grid.innerHTML = templates.map(t => {
                    const catBadge = t.category === 'preload'
                        ? '<span style="background:rgba(0,255,204,0.08);color:var(--accent);padding:2px 8px;border-radius:4px;font-size:9px;text-transform:uppercase;letter-spacing:0.06em;">Preload</span>'
                        : '<span style="background:rgba(255,255,255,0.04);color:var(--muted);padding:2px 8px;border-radius:4px;font-size:9px;text-transform:uppercase;letter-spacing:0.06em;">Standard</span>';
                    const previewId = t.id || t.template_key;
                    const name = escapeHtml(t.name);
                    return `
                    <div class="card" style="overflow:hidden;display:flex;flex-direction:column;">
                        <div style="position:relative;height:170px;background:#e8eaed;overflow:hidden;display:flex;align-items:center;
                           justify-content:center;"> <div id="preview-${previewId}" style="width:100%;height:170px;">
                                <div style="text-align:center;color:var(--muted);font-size:12px;">
                                    <i class="fas fa-spinner fa-spin" style="font-size:20px;"></i>
                                    <div>Loading preview...</div>
                                </div>
                            </div>
                            <div style="position:absolute;top:8px;left:8px;">${catBadge}</div>
                            <div style="position:absolute;bottom:0;left:0;right:0;height:24px;background:linear-gradient(to top,rgba(0,0,0,0.6),transparent);display:flex;align-items:center;justify-content:center;">
                                <button class="btn-outline" style="background:rgba(0,0,0,0.6);border:none;color:#fff;font-size:10px;padding:4px 10px;cursor:pointer;" onclick="openPreview('${previewId}', '${name}')">View Full Preview</button>
                            </div>
                        </div>
                        <div style="padding:12px;display:flex;flex-direction:column;gap:10px;flex:1;">
                            <span style="font-size:13px;font-weight:700;color:var(--text-main);">${name}</span>
                            <div style="display:flex;gap:6px;margin-top:auto;">
                                <button class="btn-accent-sm" style="flex:1;padding:6px;font-size:10px;" onclick="useTemplate('${t.template_key}', '${name}')"><i class="fas fa-arrow-right"></i> Use</button>
                            </div>
                        </div>
                    </div>`;
                }).join('');
                // Auto-load previews after DOM is ready with slight delay
                requestAnimationFrame(() => {
                    setTimeout(() => {
                        templates.forEach(t => {
                            const id = t.id || t.template_key;
                            if (id) loadTemplatePreview(id);
                        });
                    }, 150);
                });
            } catch (e) {
                console.error('Failed to load templates:', e);
                const grid = document.getElementById('templateGrid');
                if (grid) grid.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i> Unable to load templates.</div>';
            }
        }

        async function loadTemplatePreview(id) {
            // Guard: check cache exists and has data
            if (window.__previewCache && window.__previewCache[id]) return;
            const container = document.getElementById('preview-' + id);
            if (!container) return;
            try {
                const res = await fetch(`${API}/templates/preview/${id}`, { headers: authHeaders() });
                if (!res.ok) throw new Error('Failed');
                const html = await res.text();
                if (window.__previewCache) window.__previewCache[id] = html;
                renderCardPreview(id, html);
            } catch (e) {
                const container = document.getElementById('preview-' + id);
                if (container) {
                    container.innerHTML = '<div style="text-align:center;color:var(--danger);font-size:11px;"><i class="fas fa-exclamation-triangle"></i> Preview unavailable</div>';
                }
            }
        }

        function renderCardPreview(id, html) {
            const container = document.getElementById('preview-' + id);
            if (!container) return;
            const iframe = document.createElement('iframe');
            iframe.style.cssText = 'width:100%;height:100%;border:none;background:#fff;';
            iframe.sandbox = 'allow-scripts allow-same-origin';
            iframe.srcdoc = html;
            container.innerHTML = '';
            container.appendChild(iframe);
        }

        async function openPreview(id, name) {
            currentPreviewTemplate = id;
            document.getElementById('previewTitle').textContent = name;
            document.getElementById('previewModal').style.display = 'flex';
            const stage = document.getElementById('previewStage');
            stage.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);"><i class="fas fa-spinner fa-spin"></i> Loading preview...</div>';
            try {
                if (!window.__previewCache || !window.__previewCache[id]) {
                    const res = await fetch(`${API}/templates/preview/${id}`, { headers: authHeaders() });
                    if (!res.ok) throw new Error('Failed');
                    if (!window.__previewCache) window.__previewCache = {};
                    window.__previewCache[id] = await res.text();
                }
                renderPreviewIframe();
            } catch (e) { stage.innerHTML = '<p style="color:var(--danger);"><i class="fas fa-exclamation-triangle"></i> Error loading preview</p>'; }
        }

        function renderPreviewIframe() {
            if (!currentPreviewTemplate) return;
            const stage = document.getElementById('previewStage');
            const html = window.__previewCache ? window.__previewCache[currentPreviewTemplate] : null;
            if (!html) { stage.innerHTML = '<p style="color:var(--danger);"><i class="fas fa-exclamation-triangle"></i> Preview data unavailable</p>'; return; }
            const iframe = document.createElement('iframe');
            if (currentDevice === 'mobile') {
                iframe.style.cssText = 'width:390px;height:680px;border:none;background:#fff;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,0.3);';
            } else {
                iframe.style.cssText = 'width:100%;height:560px;border:none;background:#fff;border-radius:8px;';
            }
            iframe.sandbox = 'allow-scripts allow-same-origin';
            iframe.srcdoc = html;
            stage.innerHTML = '';
            stage.appendChild(iframe);
        }

        function closePreview() { document.getElementById('previewModal').style.display = 'none'; currentPreviewTemplate = null; }
        function deployTemplate(id) { window.location.href = `/user-panel/links?template=${encodeURIComponent(id)}`; }
        function deployFromPreview() { if (currentPreviewTemplate) deployTemplate(currentPreviewTemplate); }

        function escapeHtml(str) {
            const s = String(str == null ? '' : str);
            let out = '';
            for (let i = 0; i < s.length; i++) {
                const code = s.charCodeAt(i);
                if (code === 38) out += '&';
                else if (code === 60) out += '<';
                else if (code === 62) out += '>';
                else if (code === 34) out += '"';
                else if (code === 39) out += '&#39;';
                else out += s[i];
            }
            return out;
        }

        function useTemplate(key, name) {
            window.location.href = `/user-panel/links?template=${encodeURIComponent(key)}&name=${encodeURIComponent(name)}`;
        }
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePreview(); });
        loadTemplates();
    </script>
</body>
</html>
