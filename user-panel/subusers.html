<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub Users – VGenius C Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/user.css">
</head>
<body>
    <aside class="main-sidebar" id="mainSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <nav class="main-header navbar"></nav>

    <main class="content-wrapper">
        <div class="page-header">
            <h1 class="page-title">Sub Users</h1>
            <button class="btn-accent-sm" onclick="addSubUser()"><i class="fas fa-user-plus"></i> Add Sub User</button>
        </div>

        <div class="card" style="overflow:hidden;">
            <table class="links-table">
                <thead><tr><th>Login Key</th><th>Created</th><th>Action</th></tr></thead>
                <tbody id="subUsersTable">
                    <tr><td colspan="3" class="empty-state"><i class="fas fa-users"></i>No sub users.</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="assets/js/user.js"></script>
    <script>
        const token = getToken();
        if (!token) window.location.href = 'index.html';
        initShared('subusers');

        async function loadSubUsers() {
            const res = await fetch(`${API}/subusers`, { headers: authHeaders() });
            const subs = await res.json();
            const tbody = document.getElementById('subUsersTable');
            if (!subs.length) {
                tbody.innerHTML = '<tr><td colspan="3" class="empty-state"><i class="fas fa-users"></i>No sub users.</td></tr>';
                return;
            }
            tbody.innerHTML = subs.map(s => `
                <tr>
                    <td style="font-family:var(--font-heading);"><i class="fas fa-key" style="margin-right:6px;color:var(--accent);"></i>${s.login_key}</td>
                    <td>${new Date(s.created_at).toLocaleDateString()}</td>
                    <td><button class="btn-danger-sm" onclick="deleteSubUser(${s.id})"><i class="fas fa-trash"></i> Delete</button></td>
                </tr>
            `).join('');
        }

        async function addSubUser() {
            const res = await fetch(`${API}/subusers`, { method: 'POST', headers: authHeaders() });
            const data = await res.json();
            if (data.login_key) {
                showToast(`Sub-user created: ${data.login_key}`);
                navigator.clipboard.writeText(data.login_key);
                loadSubUsers();
            }
        }

        async function deleteSubUser(id) {
            showConfirm({
                title: 'Delete Sub User',
                message: 'Are you sure you want to remove this sub user? Their access will be revoked immediately.',
                confirmText: 'Delete',
                onConfirm: async () => {
                    await fetch(`${API}/subusers/${id}`, { method: 'DELETE', headers: authHeaders() });
                    loadSubUsers();
                    showToast('Sub-user deleted');
                }
            });
        }

        loadSubUsers();
    </script>
</body>
</html>
