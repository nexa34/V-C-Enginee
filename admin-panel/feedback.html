<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback – VGenius Admin</title>
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <aside class="main-sidebar" id="adminMainSidebar"></aside>
        <div class="sidebar-overlay" id="adminSidebarOverlay" onclick="toggleAdminSidebar()"></div>
        <nav class="main-header navbar"></nav>

        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">User Feedback</h1>
                <button class="btn-sm" onclick="loadFeedback()"><i class="fas fa-sync"></i> Refresh</button>
            </div>

            <div id="feedbackList"></div>
        </main>
    </div>

    <script src="assets/js/admin.js"></script>
    <script>
        initAdminShared('feedback');

        async function loadFeedback() {
            const res = await fetch('/api/admin/feedback', { headers: adminHeaders() });
            const data = await res.json();
            const container = document.getElementById('feedbackList');
            if (!data.length) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-comment-slash"></i><div>No feedback yet.</div></div>';
                return;
            }
            container.innerHTML = data.map(f => `
                <div class="card" style="margin-bottom:16px;">
                    <div style="padding:20px;">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                            <div>
                                <span style="font-weight:700;font-size:14px;">${f.subject || 'No Subject'}</span>
                                <span style="margin-left:12px;font-size:12px;color:var(--muted);">from <strong style="color:var(--text);">${f.login_key || 'User ' + f.user_id}</strong></span>
                            </div>
                            <span class="status-badge-enhanced ${f.status}">${f.status.toUpperCase()}</span>
                        </div>
                        <div style="font-size:13px;color:var(--text);line-height:1.6;margin-bottom:12px;padding:12px;background:rgba(255,255,255,0.02);border-radius:8px;">${f.message}</div>
                        ${f.admin_reply ? `<div style="border-left:3px solid var(--accent);padding-left:12px;margin:12px 0;font-size:13px;color:var(--text);">${f.admin_reply}</div>` : ''}
                        <div style="font-size:11px;color:var(--muted);margin-bottom:12px;">${new Date(f.created_at).toLocaleString()}</div>
                        <div style="display:flex;gap:8px;">
                            <input type="text" id="reply_${f.id}" placeholder="Admin reply..." style="flex:1;padding:8px 12px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:8px;color:var(--text);">
                            <button class="btn-sm" onclick="replyFeedback(${f.id})"><i class="fas fa-reply"></i> Reply</button>
                            ${f.status !== 'resolved' ? `<button class="btn-sm accent" onclick="resolveFeedback(${f.id})"><i class="fas fa-check"></i> Resolve</button>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function replyFeedback(id) {
            const reply = document.getElementById(`reply_${id}`).value.trim();
            if (!reply) return showToast('Enter a reply', true);
            await fetch(`/api/admin/feedback/${id}`, {
                method: 'PUT',
                headers: adminHeaders(),
                body: JSON.stringify({ admin_reply: reply }),
            });
            showToast('Reply sent');
            loadFeedback();
        }

        async function resolveFeedback(id) {
            await fetch(`/api/admin/feedback/${id}`, {
                method: 'PUT',
                headers: adminHeaders(),
                body: JSON.stringify({ status: 'resolved' }),
            });
            showToast('Feedback resolved');
            loadFeedback();
        }

        loadFeedback();
    </script>
</body>
</html>
