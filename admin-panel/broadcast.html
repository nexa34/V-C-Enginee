<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broadcast – VGenius Admin</title>
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">🔐 VGENIUS</div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="users.html" class="nav-item">Users</a>
            <a href="tokens.html" class="nav-item">Tokens</a>
            <a href="payments.html" class="nav-item">Payments</a>
            <a href="workers.html" class="nav-item">Workers</a>
            <a href="templates.html" class="nav-item">Templates</a>
            <a href="designs.html" class="nav-item">Verification Designs</a>
            <a href="settings.html" class="nav-item">Settings</a>
            <a href="broadcast.html" class="nav-item active">Broadcast</a>
            <a href="feedback.html" class="nav-item">Feedback</a>
            <a href="auditlog.html" class="nav-item">Audit Log</a>
        </nav>
        <div class="sidebar-footer"><button class="btn-logout" onclick="logout()">Logout</button></div>
    </aside>
    <main class="main-content">
        <h1 class="page-title">Broadcast Message</h1>
        <div class="form-group"><label>Target</label><select id="target"><option value="all_active">All Active Users</option><option value="expired">Expired Users</option><option value="all">All Users</option></select></div>
        <div class="form-group"><label>Message</label><textarea id="broadcastMsg" rows="4" style="width:100%;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:8px;color:var(--text);padding:10px;"></textarea></div>
        <button class="btn-sm accent" onclick="sendBroadcast()">Send Broadcast</button>
    </main>
</div>
<script src="assets/js/admin.js"></script>
<script>
if (!localStorage.getItem('vg-admin-token')) window.location.href = 'index.html';
async function sendBroadcast() {
    const target = document.getElementById('target').value;
    const message = document.getElementById('broadcastMsg').value.trim();
    if (!message) return showToast('Enter a message', true);
    const res = await fetch('/api/broadcast', {
        method: 'POST',
        headers: adminHeaders(),
        body: JSON.stringify({ message, target }),
    });
    const data = await res.json();
    showToast(`Sent to ${data.notifications_sent || 0} users.`);
}
</script>
</body>
</html>
