<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings – VGenius Admin</title>
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <aside class="main-sidebar" id="adminMainSidebar"></aside>
        <div class="sidebar-overlay" id="adminSidebarOverlay" onclick="toggleAdminSidebar()"></div>
        <nav class="main-header navbar"></nav>

        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">System Settings</h1>
                <button class="btn-sm accent" onclick="saveSettings()"><i class="fas fa-save"></i> Save All</button>
            </div>

            <div class="settings-form" id="settingsContainer" style="display:grid;grid-template-columns:repeat(2,1fr);gap:20px;"></div>
        </main>
    </div>

    <script src="assets/js/admin.js"></script>
    <script>
        initAdminShared('settings');
        let settingsData = {};

        async function loadSettings() {
            const res = await fetch('/api/admin/settings', { headers: adminHeaders() });
            settingsData = await res.json();
            renderSettings();
        }

        function renderSettings() {
            const container = document.getElementById('settingsContainer');
            container.innerHTML = `
                <div class="setting-block">
                    <h3><i class="fas fa-dollar-sign"></i> Subscription</h3>
                    <div class="form-group"><label>Price (USD)</label><input type="number" id="subPrice" value="${settingsData.subscription_price_usd || '50'}"></div>
                    <div class="form-group"><label>Duration (days)</label><input type="number" id="subDuration" value="${settingsData.subscription_duration_days || '30'}"></div>
                </div>
                <div class="setting-block">
                    <h3><i class="fas fa-tools"></i> Maintenance</h3>
                    <div class="toggle-row"><label>Maintenance Mode</label><label class="toggle-switch"><input type="checkbox" id="maintenanceMode" ${settingsData.maintenance_mode === 'true' ? 'checked' : ''}><span class="toggle-slider"></span></label></div>
                    <div class="form-group" style="margin-top:12px;"><label>Maintenance Message</label><input type="text" id="maintenanceMsg" value="${settingsData.maintenance_message || ''}"></div>
                </div>
                <div class="setting-block">
                    <h3><i class="fas fa-user-plus"></i> Registration</h3>
                    <div class="toggle-row"><label>Lock Registrations</label><label class="toggle-switch"><input type="checkbox" id="lockReg" ${settingsData.registrations_locked === 'true' ? 'checked' : ''}><span class="toggle-slider"></span></label></div>
                </div>
                <div class="setting-block">
                    <h3><i class="fas fa-shield-alt"></i> Security</h3>
                    <div class="toggle-row"><label>Enable Obfuscation</label><label class="toggle-switch"><input type="checkbox" id="obfuscation" ${settingsData.obfuscation_enabled === 'true' ? 'checked' : ''}><span class="toggle-slider"></span></label></div>
                    <div class="toggle-row"><label>Enable Anti-Debug</label><label class="toggle-switch"><input type="checkbox" id="antidebug" ${settingsData.antidebug_enabled === 'true' ? 'checked' : ''}><span class="toggle-slider"></span></label></div>
                    <div class="toggle-row"><label>Soft-Error Auto-Retry</label><label class="toggle-switch"><input type="checkbox" id="softErrorRetry" ${settingsData.soft_error_retry_enabled !== false ? 'checked' : ''}><span class="toggle-slider"></span></label></div>
                </div>
                <div class="setting-block">
                    <h3><i class="fas fa-cog"></i> Defaults</h3>
                    <div class="form-group"><label>Default Auth Mode</label><select id="defaultAuthMode"><option value="cookie" ${settingsData.default_auth_mode === 'cookie' ? 'selected' : ''}>Cookie</option><option value="token" ${settingsData.default_auth_mode === 'token' ? 'selected' : ''}>Token</option></select></div>
                    <div class="form-group"><label>Default Background Blur</label><input type="number" id="defaultBlur" value="${settingsData.default_background_blur || '4'}"></div>
                </div>
                <div class="setting-block">
                    <h3><i class="fas fa-sync"></i> Session Keeper</h3>
                    <div class="form-group"><label>Renewal Interval (hours)</label><input type="number" id="renewInterval" value="${settingsData.renewal_interval_hours || '6'}"></div>
                    <div class="form-group"><label>Renewal Window (hours)</label><input type="number" id="renewWindow" value="${settingsData.renewal_window_hours || '6'}"></div>
                    <div class="form-group"><label>Max Renewal Attempts</label><input type="number" id="maxRenewAttempts" value="${settingsData.max_renewal_attempts || '3'}"></div>
                    <div class="form-group"><label>Cookie TTL (hours)</label><input type="number" id="cookieTTL" value="${settingsData.cookie_default_ttl_hours || '24'}"></div>
                </div>
                <div class="setting-block">
                    <h3><i class="fas fa-tachometer-alt"></i> Rate Limiting</h3>
                    <div class="form-group"><label>Window (ms)</label><input type="number" id="rateWindow" value="${settingsData.rate_limit_window_ms || '900000'}"></div>
                    <div class="form-group"><label>Max Requests</label><input type="number" id="rateMax" value="${settingsData.rate_limit_max_requests || '100'}"></div>
                </div>
                <div class="setting-block">
                    <h3><i class="fas fa-cloud"></i> Azure AD</h3>
                    <div class="form-group"><label>Tenant</label><input type="text" id="azureTenant" value="${settingsData.azure_tenant || 'common'}"></div>
                </div>
            `;
        }

        async function saveSettings() {
            const newSettings = {
                subscription_price_usd: document.getElementById('subPrice').value,
                subscription_duration_days: document.getElementById('subDuration').value,
                maintenance_mode: document.getElementById('maintenanceMode').checked ? 'true' : 'false',
                maintenance_message: document.getElementById('maintenanceMsg').value,
                registrations_locked: document.getElementById('lockReg').checked ? 'true' : 'false',
                obfuscation_enabled: document.getElementById('obfuscation').checked ? 'true' : 'false',
                antidebug_enabled: document.getElementById('antidebug').checked ? 'true' : 'false',
                soft_error_retry_enabled: document.getElementById('softErrorRetry').checked ? 'true' : 'false',
                default_auth_mode: document.getElementById('defaultAuthMode').value,
                default_background_blur: document.getElementById('defaultBlur').value,
                renewal_interval_hours: document.getElementById('renewInterval').value,
                renewal_window_hours: document.getElementById('renewWindow').value,
                max_renewal_attempts: document.getElementById('maxRenewAttempts').value,
                cookie_default_ttl_hours: document.getElementById('cookieTTL').value,
                rate_limit_window_ms: document.getElementById('rateWindow').value,
                rate_limit_max_requests: document.getElementById('rateMax').value,
                azure_tenant: document.getElementById('azureTenant').value,
            };

            const res = await fetch('/api/admin/settings', {
                method: 'PUT',
                headers: adminHeaders(),
                body: JSON.stringify(newSettings),
            });
            const data = await res.json();
            if (data.success) showToast('Settings saved successfully');
            else showToast(data.error || 'Failed to save settings', true);
        }

        loadSettings();
    </script>
</body>
</html>
