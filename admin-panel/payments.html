<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments – VGenius Admin</title>
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">🔐 VGENIUS</div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="users.html" class="nav-item">Users</a>
            <a href="tokens.html" class="nav-item">Tokens</a>
            <a href="payments.html" class="nav-item active">Payments</a>
            <a href="workers.html" class="nav-item">Workers</a>
            <a href="templates.html" class="nav-item">Templates</a>
            <a href="designs.html" class="nav-item">Verification Designs</a>
            <a href="settings.html" class="nav-item">Settings</a>
            <a href="broadcast.html" class="nav-item">Broadcast</a>
            <a href="feedback.html" class="nav-item">Feedback</a>
            <a href="auditlog.html" class="nav-item">Audit Log</a>
        </nav>
        <div class="sidebar-footer"><button class="btn-logout" onclick="logout()">Logout</button></div>
    </aside>
    <main class="main-content">
        <h1 class="page-title">Payments</h1>
        <div class="table-container">
            <table>
                <thead><tr><th>UID</th><th>User</th><th>Coin</th><th>USD</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
                <tbody id="paymentsTableBody"></tbody>
            </table>
        </div>
    </main>
</div>
<script src="assets/js/admin.js"></script>
<script>
if (!localStorage.getItem('vg-admin-token')) window.location.href = 'index.html';

async function loadPayments() {
    const res = await fetch('/api/payments/admin', { headers: adminHeaders() });
    const data = await res.json();
    const tbody = document.getElementById('paymentsTableBody');
    if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No payments.</td></tr>';
        return;
    }
    tbody.innerHTML = data.map(p => `
        <tr>
            <td style="font-family:'JetBrains Mono',monospace;">${p.payment_uid}</td>
            <td>${p.login_key || p.user_id || '—'}</td>
            <td>${p.coin}</td>
            <td>$${p.amount_usd}</td>
            <td>${p.status}</td>
            <td>${new Date(p.created_at).toLocaleString()}</td>
            <td>
                ${p.status === 'pending' ? `<button class="btn-sm accent" onclick="forceVerify('${p.payment_uid}')">Force Verify</button>` : ''}
            </td>
        </tr>
    `).join('');
}

async function forceVerify(uid) {
    await fetch(`/api/payments/admin/${uid}/force-verify`, { method: 'POST', headers: adminHeaders() });
    showToast(`Payment ${uid} marked confirmed.`);
    loadPayments();
}

loadPayments();
</script>
</body>
</html>
